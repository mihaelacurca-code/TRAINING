<title>Cyber-Bridge Range</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
:root{
  --disp:var(--font-display); --body:var(--font-body); --mono:var(--font-mono);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-base);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--tx3)}
.spacer{flex:1 1 auto}

/* ambient atmosphere layer */
#amb{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.85}
#veil{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1200px 700px at 78% -10%,color-mix(in srgb,var(--info) 9%,transparent),transparent 60%),
             radial-gradient(900px 600px at 4% 108%,color-mix(in srgb,var(--sim) 8%,transparent),transparent 58%);
  transition:background .9s ease}
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) 1fr;min-height:100%}
.app.focus{grid-template-columns:1fr}
.app.focus .rail{display:none}

.rail{border-right:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(14px);
  padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{width:28px;height:28px;flex:none}
.brand b{font-family:var(--disp);font-size:15px;font-weight:800;letter-spacing:.05em;display:block;line-height:1.15}
.brand span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-sm);
  color:var(--tx2);font-size:13.5px;border:1px solid transparent;transition:background .12s,color .12s}
.nav button:hover{background:var(--hover);color:var(--tx)}
.nav button[aria-current="true"]{background:color-mix(in srgb,var(--amb) 12%,transparent);border-color:color-mix(in srgb,var(--amb) 30%,transparent);color:var(--tx)}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--idle);flex:none}
.nav button[aria-current="true"] .dot{background:var(--amb);box-shadow:0 0 10px var(--amb)}
.rail-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--bd)}

.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--bd);
  background:var(--glass);backdrop-filter:blur(18px);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.sel{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--bd);border-radius:999px;background:var(--sunk)}
.sel select{background:none;border:none;color:var(--tx);font:inherit;font-size:13px;padding:1px 2px;cursor:pointer;max-width:200px}
.sel select option{background:var(--solid-raised);color:var(--tx)}
.roles{display:flex;gap:3px;padding:3px;border:1px solid var(--bd);border-radius:999px;background:var(--sunk)}
.roles button{padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--tx3)}
.roles button[aria-pressed="true"]{background:color-mix(in srgb,var(--amb) 15%,transparent);color:var(--tx)}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--bd);border-radius:999px;background:var(--sunk)}
.lang button{padding:4px 9px;border-radius:999px;font-family:var(--mono);font-size:11.5px;color:var(--tx3);letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--sel);color:var(--tx)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--bd);background:var(--sunk);font-size:12.5px;color:var(--tx2)}
.chip .val{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--tx);font-weight:600}

main{padding:26px 22px 64px;max-width:1460px;width:100%}
.view{display:flex;flex-direction:column;gap:20px}
.head h1{font-size:27px;font-weight:700;letter-spacing:-.01em}
.head p{margin:6px 0 0;color:var(--tx2);max-width:70ch}

.panel{background:var(--bg-raised);border:1px solid var(--bd);border-radius:var(--r-lg);padding:20px;backdrop-filter:var(--surface-blur)}
.panel.flush{padding:0;overflow:hidden}
.panel h3{font-size:15px;font-weight:600;margin-bottom:3px}
.panel .sub{color:var(--tx3);font-size:12.5px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

.mark{display:inline-block;width:9px;height:9px;flex:none;background:currentColor}
.mark.info{border-radius:50%;color:var(--info)}
.mark.ok{color:var(--ok);clip-path:polygon(14% 46%,0 60%,40% 100%,100% 22%,86% 8%,38% 70%)}
.mark.sim{color:var(--sim);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.mark.warn{color:var(--warn);clip-path:polygon(50% 4%,100% 96%,0 96%)}
.mark.crit{color:var(--crit);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.mark.idle{color:var(--idle);height:3px;align-self:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-family:var(--mono);border:1px solid var(--bd);color:var(--tx2);white-space:nowrap}
.pill.crit{border-color:color-mix(in srgb,var(--crit) 44%,transparent);color:var(--crit-tx)}
.pill.warn{border-color:color-mix(in srgb,var(--warn) 44%,transparent);color:var(--warn-tx)}
.pill.ok{border-color:color-mix(in srgb,var(--ok) 42%,transparent);color:var(--ok-tx)}
.pill.info{border-color:color-mix(in srgb,var(--info) 42%,transparent);color:var(--info-tx)}
.pill.sim{border-color:color-mix(in srgb,var(--sim) 44%,transparent);color:var(--sim-tx)}
.pill.idle{color:var(--tx3)}

.mc{display:grid;grid-template-columns:minmax(258px,318px) 1fr;gap:16px;align-items:start}
.ring{width:190px;height:190px;display:block;margin:0 auto}
.ring .track{fill:none;stroke:var(--track);stroke-width:12}
.ring .prog{fill:none;stroke:var(--amb);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .9s cubic-bezier(.16,1,.3,1)}
.ring-val{font-family:var(--disp);font-size:42px;font-weight:700;fill:var(--tx);font-variant-numeric:tabular-nums}
.ring-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;fill:var(--tx3)}
.segs{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.seg{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:12.5px}
.seg .bar{grid-column:1/-1;height:4px;border-radius:999px;background:var(--track);overflow:hidden}
.seg .bar i{display:block;height:100%;border-radius:999px;background:var(--amb)}
.seg .n{font-family:var(--mono);color:var(--tx3);font-variant-numeric:tabular-nums}

.nba{border:1px solid color-mix(in srgb,var(--amb) 32%,transparent);border-radius:var(--r-lg);padding:20px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--amb) 10%,transparent),color-mix(in srgb,var(--sim) 7%,transparent))}
.nba h3{font-size:19px;margin:8px 0 6px}
.nba p{margin:0 0 16px;color:var(--tx2);max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border-radius:var(--r-sm);background:var(--amb);color:var(--tx-inv);font-weight:600;font-size:14px;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px color-mix(in srgb,var(--amb) 30%,transparent)}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--bd-strong)}
.btn.ghost:hover{background:var(--hover);box-shadow:none}
.btn.sim{background:var(--sim);color:#fff}

.alerts{display:flex;flex-direction:column}
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-top:1px solid var(--bd)}
.alert:first-child{border-top:none}
.alert .mark{margin-top:7px}
.alert p{margin:0;font-size:13.5px}
.alert .meta{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-top:3px}

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(248px,1fr))}
.card{display:flex;flex-direction:column;gap:9px;padding:16px;border-radius:var(--r-md);border:1px solid var(--bd);
  background:var(--bg-overlay);text-align:left;width:100%;transition:border-color .14s,transform .14s}
.card:hover{border-color:var(--bd-strong);transform:translateY(-2px)}
.card h4{font-size:14.5px;font-weight:600}
.card p{margin:0;font-size:12.5px;color:var(--tx3);flex:1}
.card .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:580px;font-size:13px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--tx3);font-weight:500;white-space:nowrap}
tbody tr:hover{background:var(--hover)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.tmap{display:grid;grid-template-columns:1fr minmax(240px,306px);gap:16px}
.plot{width:100%;height:auto;display:block}
.plot text{font-family:var(--mono);font-size:9px;fill:var(--tx3)}
.plot .axis{stroke:var(--bd)}
.plot .gl{stroke:var(--hover)}
.node{cursor:pointer}
.node text{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tlegend{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:2px;grid-template-columns:repeat(auto-fit,minmax(236px,1fr))}
.tlegend button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 8px;border-radius:var(--r-sm);font-size:12.5px;color:var(--tx2);border:1px solid transparent}
.tlegend button:hover{background:var(--hover);color:var(--tx)}
.tlegend button[aria-pressed="true"]{background:color-mix(in srgb,var(--amb) 10%,transparent);border-color:color-mix(in srgb,var(--amb) 28%,transparent);color:var(--tx)}
.tlegend .tn{width:17px;flex:none;text-align:center;font-size:11px;color:var(--tx3);font-family:var(--mono)}
.tlegend .tl{overflow-wrap:anywhere}

.sim-stage{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sim-bar{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:12px 18px;border:1px solid color-mix(in srgb,var(--sim) 34%,transparent);border-radius:var(--r-md);
  background:linear-gradient(90deg,color-mix(in srgb,var(--sim) 13%,transparent),var(--bg-raised))}
.clock{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tplus{font-family:var(--mono);font-size:12px;color:var(--sim);letter-spacing:.08em}
.timer{font-family:var(--mono);font-size:13px;color:var(--warn);font-variant-numeric:tabular-nums}
.timer.off{color:var(--tx3)}
.rt{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.rt i{width:24px;height:3px;border-radius:2px;background:var(--track);display:block}
.rt i.done{background:var(--sim)}
.rt i.now{background:var(--tx);box-shadow:0 0 8px var(--tx)}

.inject{border:1px solid var(--bd);border-radius:var(--r-lg);background:var(--bg-raised);overflow:hidden}
.inject-h{display:flex;gap:10px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--bd);background:var(--sunk);flex-wrap:wrap}
.inject-b{padding:20px}
.inject-b .msg{font-size:16px;line-height:1.65;margin:0}
.inject-b .q{font-family:var(--disp);font-size:17px;font-weight:600;margin:18px 0 0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--bd);
  background:var(--bg-overlay);text-align:left;width:100%;transition:border-color .13s,background .13s}
.opt:hover:not(:disabled){border-color:var(--sim);background:color-mix(in srgb,var(--sim) 10%,transparent)}
.opt:disabled{opacity:.38;cursor:default}
.opt.chosen{opacity:1;border-color:var(--sim);background:color-mix(in srgb,var(--sim) 15%,transparent)}
.opt.chosen .k{color:var(--sim)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--tx3);padding-top:1px;display:flex;align-items:center;gap:5px}

.consq{border:1px solid var(--bd-strong);border-radius:var(--r-lg);background:var(--bg-overlay);padding:20px;display:flex;flex-direction:column;gap:14px}
.consq .lead{font-size:15.5px;margin:0;line-height:1.65}
.consq .alt{font-size:13.5px;color:var(--tx2);margin:0;padding-left:14px;border-left:2px solid var(--bd-strong)}
.deltas{display:flex;gap:8px;flex-wrap:wrap}
.dlt{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--bd);font-variant-numeric:tabular-nums}
.dlt.up{color:var(--ok-tx);border-color:color-mix(in srgb,var(--ok) 42%,transparent)}
.dlt.dn{color:var(--crit-tx);border-color:color-mix(in srgb,var(--crit) 42%,transparent)}
.dlt.z{color:var(--tx3)}
.axes{display:grid;gap:11px}
.ax{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:13px}
.ax .bar{grid-column:1/-1;height:6px;border-radius:999px;background:var(--track);overflow:hidden}
.ax .bar i{display:block;height:100%;border-radius:999px;transition:width .7s cubic-bezier(.16,1,.3,1)}
.ax .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--tx2)}

.mx table{min-width:640px}
.cell{display:flex;gap:3px}
.lv{width:22px;height:22px;border-radius:4px;background:var(--track);border:1px solid transparent;position:relative}
.lv.on{border-color:var(--lvbd)}
.lv.cur{outline:2px solid var(--tx);outline-offset:1px}
.lv.tgt::after{content:"";position:absolute;inset:4px;border:1.5px dashed var(--dash);border-radius:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx3);padding:0 20px 18px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.note{font-size:12.5px;color:var(--tx3);border-left:2px solid var(--bd-strong);padding-left:12px;margin:0}

/* instrument editor */
.ed{max-width:1000px;display:flex;flex-direction:column;gap:18px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:13px;color:var(--tx2)}
.fld .hint{font-size:11.5px;color:var(--tx3);font-family:var(--mono)}
input[type=text],textarea{width:100%;background:var(--sunk);border:1px solid var(--bd);border-radius:var(--r-sm);
  color:var(--tx);font:inherit;font-size:13.5px;padding:9px 11px;resize:vertical}
input[type=text]:focus,textarea:focus{border-color:var(--amb);outline:none}
textarea{min-height:76px;line-height:1.55}
.etab{width:100%;border-collapse:collapse;min-width:100%}
.etab th{white-space:normal}
.etab td{padding:5px 6px;border-bottom:1px solid var(--bd)}
.etab input[type=text]{padding:7px 9px;font-size:13px;min-width:120px}
.etab td.del{width:34px;padding-right:0}
.rmv{color:var(--tx3);font-size:16px;line-height:1;padding:4px 7px;border-radius:var(--r-sm)}
.rmv:hover{color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.cks{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer}
.ck:hover{background:var(--hover)}
.ck.on{background:color-mix(in srgb,var(--ok) 9%,transparent);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.ck .bx{width:17px;height:17px;flex:none;border:1.5px solid var(--bd-strong);border-radius:4px;margin-top:2px;position:relative}
.ck.on .bx{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent)}
.ck.on .bx::after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:9px;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
.ck span.tx{font-size:13.5px}
.edbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0;position:sticky;bottom:0;
  background:linear-gradient(to top,var(--bg-base) 62%,transparent)}
.saved{font-family:var(--mono);font-size:11.5px;color:var(--ok)}
.saved.warn{color:var(--warn)}
.stsel{display:flex;gap:3px;padding:3px;border:1px solid var(--bd);border-radius:999px;background:var(--sunk)}
.stsel button{padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--tx3)}
.stsel button[aria-pressed="true"]{background:var(--sel);color:var(--tx)}
.scn-pick{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(272px,1fr))}

/* ---- facilitator ---- */
.fbtn{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--sim) 40%,transparent);background:color-mix(in srgb,var(--sim) 13%,transparent);
  font-size:12.5px;color:var(--sim-tx)}
.fbtn:hover{background:color-mix(in srgb,var(--sim) 20%,transparent)}
.fbtn canvas{width:18px;height:18px}
#fac{position:fixed;top:0;right:0;bottom:0;width:390px;max-width:100%;z-index:60;display:flex;flex-direction:column;
  background:var(--drawer);backdrop-filter:blur(20px);border-left:1px solid var(--bd);
  transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#fac.on{transform:none}
#fac header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bd)}
#fac header h3{font-size:14px;font-weight:600}
#fac header p{margin:1px 0 0;font-size:11px;font-family:var(--mono);color:var(--tx3);letter-spacing:.06em}
#facAv{width:44px;height:44px;flex:none}
.fclose{color:var(--tx3);font-size:19px;line-height:1;padding:5px 9px;border-radius:var(--r-sm)}
.fclose:hover{color:var(--tx);background:var(--hover)}
#facLog{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.fmsg{font-size:13.5px;line-height:1.62}
.fmsg.me{color:var(--tx2);border-left:2px solid var(--bd-strong);padding-left:11px}
.fmsg.it{color:var(--tx);white-space:pre-wrap}
.fmsg.err{color:var(--crit-tx);font-size:12.5px}
.fthink{font-family:var(--mono);font-size:11.5px;color:var(--sim);letter-spacing:.08em}
.fsug{display:flex;flex-direction:column;gap:6px;padding:0 16px 10px}
.fsug button{text-align:left;font-size:12.5px;color:var(--tx2);padding:8px 11px;border:1px solid var(--bd);
  border-radius:var(--r-sm);background:var(--bg-overlay)}
.fsug button:hover{border-color:var(--sim);color:var(--tx)}
#fac footer{padding:12px 16px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:9px}
.frow{display:flex;gap:8px;align-items:flex-end}
#facIn{flex:1;min-height:40px;max-height:110px}
.ficon{padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--bd-strong);color:var(--tx2);font-size:13px}
.ficon:hover{background:var(--hover);color:var(--tx)}
.ficon[aria-pressed="true"]{border-color:var(--sim);color:var(--sim-tx);background:color-mix(in srgb,var(--sim) 15%,transparent)}
.fnote{font-size:11px;color:var(--tx3);line-height:1.45}
@media (max-width:640px){#fac{width:100%}}
.sgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
.scard{display:flex;flex-direction:column;gap:10px;padding:17px;border-radius:var(--r-md);border:1px solid var(--bd);
  background:var(--bg-overlay);text-align:left;transition:border-color .14s,transform .14s;position:relative;overflow:hidden}
.scard:hover{transform:translateY(-2px)}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc)}
.scard[aria-current="true"]{border-color:var(--sc)}
.scard h4{font-size:15px;font-weight:600}
.scard p{margin:0;font-size:12.5px;color:var(--tx3);flex:1}

           data:"var(--info)",legal:"var(--sim)",evi:"var(--warn)"};
const VIEWS=[

 {id:"thr",k:"thr",roles:["mgmt","tech"]},

];
const STORE="cbr.v1";
let S={lang:"ro",skin:"brand",sector:"health",role:"mgmt",view:"mc",threat:0,timerOn:true,kitOpen:null,
       sim:{scn:0,step:-1,log:[],ax:{},done:false},done:{}};
try{const r=localStorage.getItem(STORE);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}}
const CV=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applySkin(){
  const d=S.skin==="dark";
  if(d)document.documentElement.setAttribute("data-skin","dark");
  else document.documentElement.removeAttribute("data-skin");
}

/* Parametri de integrare / integration parameters:
   ?skin=light|dark  ?embed=1  ?lang=ro|en  ?sector=<id>  ?view=<id>
   Gazda poate lega direct la un sector sau la un ecran anume. */
(function(){
  let q;try{q=new URLSearchParams(location.search);}catch(e){return;}
  const root=document.documentElement;
  const skin=q.get("skin"); if(skin==="dark")S.skin="dark"; else if(skin==="brand"||skin==="light")S.skin="brand";
  if(q.get("embed")==="1")root.setAttribute("data-embed","1");
  const lg=q.get("lang"); if(lg==="ro"||lg==="en")S.lang=lg;
  const sc=q.get("sector"); if(sc&&SECTORS.some(x=>x.id===sc)){S.sector=sc;S.threat=0;S.kitOpen=null;
    S.sim={sector:sc,scn:0,picked:false,step:-1,log:[],ax:{},done:false};}
  const vw=q.get("view"); if(vw&&VIEWS.some(v=>v.id===vw))S.view=vw;
  const rl=q.get("role"); if(["mgmt","tech","hyg"].indexOf(rl)>=0)S.role=rl;
})();
applySkin();

const L=x=>(x&&typeof x==="object"&&("ro" in x))?(x[S.lang]||x.ro):x;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sec=()=>SECTORS.find(x=>x.id===S.sector)||SECTORS[0];
const scnList=()=>[SCENARIOS[S.sector],SCN2[S.sector],SCN3[S.sector]].filter(Boolean);
const scn=()=>scnList()[S.sim.scn||0];
function kitsFor(s){return CORE_KITS.concat(s.extraKits||[]);}

/* ---------- stratul de date: db partajat, cu revenire la browser ---------- */
const KD={};                 /* cache: "sector__kit" -> {status,data} */
let DB=null,DBST="pending";  /* pending | shared | local */
const kid=(sid,k)=>sid+"__"+k;
function lsKey(id){return "cbr.kit."+id;}
function kitDoc(sid,k){
  const id=kid(sid,k);
  if(KD[id])return KD[id];
  let v=null;
  try{const r=localStorage.getItem(lsKey(id));if(r)v=JSON.parse(r);}catch(e){}
  KD[id]=v||{status:"todo",data:{}};
  return KD[id];
}
function kitWrite(sid,k,doc){
  const id=kid(sid,k);KD[id]=doc;
  try{localStorage.setItem(lsKey(id),JSON.stringify(doc));}catch(e){}
  if(DB){ DB.doc("instruments/"+id).set({sector:sid,kit:k,status:doc.status,data:doc.data,updatedAt:Date.now()})
    .catch(()=>{}); }
}
(async function(){
  try{
    const d=window.claude&&claude.use?await claude.use("db"):null;
    if(!d){DBST="local";return;}
    DB=d;DBST="shared";
    const rows=await d.collection("instruments").get();
    (rows||[]).forEach(r=>{const v=r.data||r;if(v&&v.sector&&v.kit)KD[kid(v.sector,v.kit)]={status:v.status||"todo",data:v.data||{}};});
    render();
  }catch(e){DBST="local";}
})();

function kitStatus(sid,k){return kitDoc(sid,k).status;}
function kitFilled(sid,k){
  const d=kitDoc(sid,k).data||{},sc=KIT_SCHEMA[k];
  if(!sc)return 0;
  if(sc.type==="table")return (d.rows||[]).filter(r=>Object.values(r).some(v=>String(v||"").trim())).length;
  if(sc.type==="check")return (d.on||[]).filter(Boolean).length;
  return sc.fields.filter(f=>String(d[f.k]||"").trim()).length;
}
function kitTotal(k){const sc=KIT_SCHEMA[k];if(!sc)return 0;
  return sc.type==="table"?0:sc.type==="check"?sc.items.length:sc.fields.length;}

function readiness(sid){
  const s=SECTORS.find(x=>x.id===sid)||sec();
  const base=s.maturity.reduce((a,b)=>a+b,0)/(16*5)*100;
  const ks=kitsFor(s);
  const kd=ks.filter(k=>kitStatus(s.id,k.k)==="done").length/ks.length*100;
  let sv=50;
  if(s.id===S.sector&&Object.keys(S.sim.ax).length){
    const v=Object.values(S.sim.ax); sv=v.reduce((a,b)=>a+b,0)/v.length;
  }
  return Math.round(base*.55+sv*.25+kd*.20);
}

/* ---------- atmosferă ---------- */
const cv=document.getElementById("amb"),cx=cv.getContext("2d");
const RM=window.matchMedia("(prefers-reduced-motion: reduce)");
let P=[],W=0,H=0,tick=0,alarm=0,raf=null;
function hueOf(){return sec().hue;}
function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cx.scale(1,1);}
function seed(){
  const m=sec().motion, n=m==="mesh"?64:m==="ticker"?110:m==="paper"?34:m==="struct"?70:56;
  P=[];for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5),vy:(Math.random()-.5),r:Math.random()*2+.7,p:Math.random()*Math.PI*2,s:Math.random()});
}
function draw(){
  const m=sec().motion,h=hueOf(),dp=devicePixelRatio;
  cx.clearRect(0,0,W,H);
  const R=getComputedStyle(document.documentElement);
  const lineL=parseFloat((R.getPropertyValue("--amb-line-l")||"62%").trim())||62;
  const wantGrid=(R.getPropertyValue("--amb-grid")||"0").trim()==="1";
  const gain=parseFloat((R.getPropertyValue("--amb-alpha")||"1").trim());
  const hue=h+alarm*(-h+8), sat=alarm>.3?85:60, al=(.30+alarm*.35)*(isNaN(gain)?1:gain);
  const col=(a)=>`hsla(${hue},${sat}%,${lineL+alarm*6}%,${a})`;
  tick+=RM.matches?0:1;
  const sp=1+alarm*1.8;
  if(wantGrid){ /* grila site-ului, ca strat de bază sub semnătura sectorului */
    const g=46*dp;cx.strokeStyle=col(al*.10);cx.lineWidth=dp*.6;
    for(let gx=0;gx<W;gx+=g){cx.beginPath();cx.moveTo(gx,0);cx.lineTo(gx,H);cx.stroke();}
    for(let gy=0;gy<H;gy+=g){cx.beginPath();cx.moveTo(0,gy);cx.lineTo(W,gy);cx.stroke();}
  }
  if(m==="mesh"){
    for(const p of P){p.x+=p.vx*.22*sp*dp;p.y+=p.vy*.22*sp*dp;
      if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;}
    cx.lineWidth=dp*.6;
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
      const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=Math.hypot(dx,dy);
      if(d<170*dp){cx.strokeStyle=col(al*.22*(1-d/(170*dp)));cx.beginPath();cx.moveTo(P[i].x,P[i].y);cx.lineTo(P[j].x,P[j].y);cx.stroke();}}
    for(const p of P){cx.fillStyle=col(al*.6);cx.beginPath();cx.arc(p.x,p.y,p.r*dp,0,7);cx.fill();}
  }else if(m==="flow"||m==="ticker"){
    const fast=m==="ticker";
    for(const p of P){p.x+=(fast?2.4:.9)*sp*dp*(0.5+p.s);
      if(p.x>W+60*dp)p.x=-60*dp;
      const len=(fast?26:60)*dp*(0.4+p.s);
      cx.strokeStyle=col(al*(fast?.5:.35));cx.lineWidth=dp*(fast?.9:.7);
      cx.beginPath();cx.moveTo(p.x-len,p.y);cx.lineTo(p.x,p.y);cx.stroke();}
  }else if(m==="grid"||m==="struct"){
    const g=(m==="grid"?96:120)*dp;
    cx.strokeStyle=col(al*.14);cx.lineWidth=dp*.6;
    for(let x=0;x<W;x+=g){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}
    for(let y=0;y<H;y+=g){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}
    for(const p of P){p.p+=.006*sp;const t2=(p.p%1);
      const gx=Math.floor(p.x/g)*g, gy=Math.floor(p.y/g)*g;
      const cxp=p.s>.5?gx+t2*g:gx, cyp=p.s>.5?gy:gy+t2*g;
      cx.fillStyle=col(al*.75);cx.beginPath();cx.arc(cxp,cyp,1.7*dp,0,7);cx.fill();}
  }else if(m==="pulse"){
    for(const p of P){p.p+=.012*sp;
      const r=(Math.sin(p.p)*.5+.5);
      cx.fillStyle=col(al*(.25+r*.5));cx.beginPath();cx.arc(p.x,p.y,(1+r*2.2)*dp,0,7);cx.fill();}
    const bt=(tick%150)/150, ring=bt*Math.max(W,H)*.6;
    cx.strokeStyle=col(al*.16*(1-bt));cx.lineWidth=dp*1.4;
    cx.beginPath();cx.arc(W*.78,H*.12,ring,0,7);cx.stroke();
  }else if(m==="mech"){
    for(const p of P){p.p+=.02*sp;
      const off=Math.sin(p.p)*14*dp;
      cx.strokeStyle=col(al*.42);cx.lineWidth=dp*1.1;
      cx.beginPath();cx.moveTo(p.x,p.y+off);cx.lineTo(p.x,p.y+off+16*dp);cx.stroke();}
  }else if(m==="burst"){
    for(const p of P){p.p+=.008*sp;const t2=p.p%1;
      cx.strokeStyle=col(al*.30*(1-t2));cx.lineWidth=dp*.8;
      cx.beginPath();cx.arc(p.x,p.y,t2*70*dp,0,7);cx.stroke();}
  }else if(m==="paper"){
    for(const p of P){p.y+=.35*sp*dp*(.4+p.s);p.p+=.004;
      if(p.y>H+40*dp)p.y=-40*dp;
      const w=22*dp*(.6+p.s),hh=30*dp*(.6+p.s);
      cx.save();cx.translate(p.x,p.y);cx.rotate(Math.sin(p.p)*.25);
      cx.strokeStyle=col(al*.26);cx.lineWidth=dp*.7;cx.strokeRect(-w/2,-hh/2,w,hh);cx.restore();}
  }else{ /* drift */
    for(const p of P){p.x+=p.vx*.14*sp*dp;p.y+=p.vy*.14*sp*dp;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      cx.fillStyle=col(al*.42);cx.beginPath();cx.arc(p.x,p.y,p.r*1.5*dp,0,7);cx.fill();}
  }
  if(!RM.matches) raf=requestAnimationFrame(draw); else raf=null;
}

function missions(s){
  const g=DOMAINS.map((d,i)=>({d:L(d),g:s.target[i]-s.maturity[i]})).sort((a,b)=>b.g-a.g);
  const ks=kitsFor(s), crit=s.kpis.filter(k=>k.st==="crit");
  const out=[];
  out.push({n:L(scn().title),p:L(scn().brief).slice(0,120)+"…",min:18,tag:L(t("Exercițiu","Exercise")),tone:"sim",v:"sim"});
  (s.extraKits||[]).forEach(k=>out.push({n:L(k.n),p:L(k.p),min:k.min,tag:L(t("Must have","Must have")),tone:"crit",v:"kit"}));
  if(crit[0])out.push({n:L(crit[0].n),p:L(t("Indicator critic. Formula și pragul sunt în tabloul de pregătire.","Critical indicator. Formula and threshold are on the readiness board.")),min:20,tag:L(t("Indicator","Indicator")),tone:"warn",v:"mat"});
  if(S.role==="mgmt")out.push({n:L(UI.cmpH),p:L(t("Ce e cerință legală, ce e standard și ce e bună practică — separat, nu amestecat.","What is legal, what is a standard and what is good practice — separated, not mixed.")),min:20,tag:L(t("Conformitate","Compliance")),tone:"info",v:"cmp"});
  else out.push({n:L(g[0].d)+" · "+L(t("decalaj","gap"))+" +"+g[0].g,p:L(t("Domeniul cu cel mai mare decalaj față de nivelul-țintă.","The domain with the largest gap to the target level.")),min:15,tag:L(t("Decalaj","Gap")),tone:"warn",v:"mat"});
  return out.slice(0,4);
}

/* export: Markdown pentru formular/checklist, CSV pentru tabel */
function kitExport(){
  const s=sec(),k=kitsFor(s).find(x=>x.k===S.kitOpen),sc=KIT_SCHEMA[k.k],d=kitDoc(s.id,k.k).data||{};
  const stamp=new Date().toISOString().slice(0,10);
  const safe=L(k.n).replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"").toLowerCase();
  if(sc&&sc.type==="table"){
    const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const lines=[sc.cols.map(c=>q(L(c.n))).join(",")];
    (d.rows||[]).forEach(r=>{ if(Object.values(r).some(v=>String(v||"").trim()))
      lines.push(sc.cols.map(c=>q(r[c.k])).join(",")); });
    return {filename:safe+"-"+stamp+".csv",data:lines.join("\r\n")};
  }
  let md="# "+L(k.n)+"\n\n"+L(s.name)+" · "+L(s.org)+"\n\n";
  if(sc&&sc.type==="check"){const on=d.on||[];
    sc.items.forEach((it,i)=>{md+="- ["+(on[i]?"x":" ")+"] "+L(it)+"\n";});}
  else if(sc){sc.fields.forEach(f=>{md+="## "+L(f.n)+"\n\n"+(d[f.k]||"—")+"\n\n";});}
  md+="\n---\n"+stamp+" · Cyber-Bridge Range\n";
  return {filename:safe+"-"+stamp+".md",data:md};
}

/* ---------- interacțiune ---------- */
let tid=null,left=90;
function stopTimer(){if(tid){clearInterval(tid);tid=null;}}
function startTimer(){
  stopTimer();const el=document.getElementById("tmr");if(!el)return;
  const answered=S.sim.log.some(l=>l.step===S.sim.step);
  if(!S.timerOn||answered){el.textContent=S.timerOn?L(UI.decided):L(UI.clockOff);el.classList.toggle("off",!S.timerOn);return;}
  left=90;el.classList.remove("off");el.textContent=left+"s";
  tid=setInterval(()=>{left--;const e=document.getElementById("tmr");if(!e){stopTimer();return;}
    e.textContent=left>0?left+"s":L(UI.expired);
    if(left<=0){stopTimer();e.style.color="var(--crit)";}},1000);
}
function choose(j){
  const st=scn().steps[S.sim.step],o=st.o[j];
  if(!Object.keys(S.sim.ax).length)axKeys().forEach(k=>S.sim.ax[k]=50);
  for(const k in o.d)S.sim.ax[k]=Math.max(0,Math.min(100,(S.sim.ax[k]||50)+o.d[k]*5));
  S.sim.log.push({step:S.sim.step,opt:j,t:L(o.t),c:L(o.c),alt:o.alt?L(o.alt):null,d:o.d});
  stopTimer();save();render();
}
function resetSim(start){
  const n=S.sim&&S.sim.scn||0,p=S.sim&&S.sim.picked;
  S.sim={sector:S.sector,scn:n,picked:p,step:start?0:-1,log:[],ax:{},done:false};
  axKeys().forEach(k=>S.sim.ax[k]=50);
}
function switchSector(id){
  S.sector=id;S.threat=0;S.kitOpen=null;
  S.sim={sector:id,scn:0,picked:false,step:-1,log:[],ax:{},done:false};
  seed();save();render();
}

document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");if(v){S.view=v.dataset.view;stopTimer();save();render();return;}
  const g=e.target.closest("[data-go]");if(g){S.view=g.dataset.go;save();render();return;}
  const r=e.target.closest("[data-role]");if(r){S.role=r.dataset.role;save();render();return;}
  const la=e.target.closest("[data-lang]");if(la){S.lang=la.dataset.lang;save();render();return;}
  if(e.target.closest("#skinBtn")){S.skin=S.skin==="dark"?"brand":"dark";applySkin();save();render();return;}
  const sc=e.target.closest("[data-sec]");if(sc){switchSector(sc.dataset.sec);return;}
  const th=e.target.closest("[data-thr]");if(th){S.threat=+th.dataset.thr;save();render();return;}
  const op=e.target.closest("[data-opt]");if(op&&!op.disabled){choose(+op.dataset.opt);return;}
  const k=e.target.closest("[data-kit]");if(k){S.kitOpen=k.dataset.kit;save();render();return;}
  if(e.target.closest("[data-kback]")){S.kitOpen=null;save();render();return;}
  const st=e.target.closest("[data-st]");if(st){
    const s=sec(),doc=kitDoc(s.id,S.kitOpen);
    kitWrite(s.id,S.kitOpen,{status:st.dataset.st,data:doc.data});save();render();return;}
  const add=e.target.closest("[data-add]");if(add){
    const s=sec(),doc=kitDoc(s.id,S.kitOpen),d=doc.data||{};
    d.rows=(d.rows&&d.rows.length?d.rows:[{}]).concat([{}]);
    kitWrite(s.id,S.kitOpen,{status:doc.status,data:d});render();return;}
  const rm=e.target.closest("[data-rm]");if(rm){
    const s=sec(),doc=kitDoc(s.id,S.kitOpen),d=doc.data||{};
    const rows=(d.rows&&d.rows.length?d.rows:[{}]).slice();
    rows.splice(+rm.dataset.rm,1); d.rows=rows.length?rows:[{}];
    kitWrite(s.id,S.kitOpen,{status:doc.status,data:d});render();return;}
  const ck=e.target.closest("[data-ck]");if(ck){
    const s=sec(),doc=kitDoc(s.id,S.kitOpen),d=doc.data||{},i=+ck.dataset.ck;
    d.on=d.on||[]; d.on[i]=!d.on[i];
    ck.classList.toggle("on",!!d.on[i]); ck.setAttribute("aria-checked",String(!!d.on[i]));
    kitWrite(s.id,S.kitOpen,{status:doc.status==="todo"?"prog":doc.status,data:d});flash();return;}
  if(e.target.closest("[data-exp]")){doExport();return;}
  const sp=e.target.closest("[data-scn]");if(sp){
    S.sim.scn=+sp.dataset.scn;resetSim(false);S.sim.picked=true;save();render();return;}
  const sm=e.target.closest("[data-sim]");if(sm){
    const a=sm.dataset.sim;
    if(a==="start"||a==="reset"){resetSim(true);S.sim.picked=true;}
    if(a==="next"){if(S.sim.step+1<scn().steps.length)S.sim.step++;else{
      S.sim.done=true;S.sim.step=-1;
      const l=S.done[S.sector]||[];if(l.indexOf(S.sim.scn)<0)l.push(S.sim.scn);S.done[S.sector]=l;}}
    if(a==="tt")S.timerOn=!S.timerOn;
    if(a==="abort"||a==="pick"){resetSim(false);S.sim.picked=false;stopTimer();}
    save();render();return;}
});

let SAMPLE=null,FACON=false,FTURNS=[],FBUSY=false,FCTL=null,FSPK=false,FST="idle";
const $=id=>document.getElementById(id);

/* --- prezența vizuală: stări, nu un chip --- */
function mix(c,a){c=String(c).trim();
  if(c[0]==="#"){const n=c.length===4?c.replace(/#(.)(.)(.)/,"#$1$1$2$2$3$3"):c;
    return "rgba("+parseInt(n.slice(1,3),16)+","+parseInt(n.slice(3,5),16)+","+parseInt(n.slice(5,7),16)+","+a+")";}
  const m=c.match(/[\d.]+/g); return m?"rgba("+m[0]+","+m[1]+","+m[2]+","+a+")":c;}
function drawAv(cv,size){
  const x=cv.getContext("2d"),w=cv.width,h=cv.height,cxp=w/2,cyp=h/2,ts=performance.now()/1000;
  x.clearRect(0,0,w,h);
  const col=FST==="alert"?CV("--crit"):FST==="thinking"?CV("--sim"):FST==="speaking"?CV("--info"):CV("--sim");
  const sp=FST==="thinking"?2.6:FST==="speaking"?1.5:.45;
  for(let i=0;i<3;i++){
    const r=(size*.26)+i*(size*.13), a=ts*sp*(i%2?-1:1)+i*2;
    x.strokeStyle=mix(col,.5-i*.11);x.lineWidth=Math.max(1,size*.022);
    x.beginPath();x.arc(cxp,cyp,r,a,a+Math.PI*(1.1-i*.22));x.stroke();
  }
  const puls=FST==="speaking"?(.5+Math.abs(Math.sin(ts*7))*.5):FST==="thinking"?(.6+Math.sin(ts*4)*.2):(.55+Math.sin(ts*1.3)*.18);
  const g=x.createRadialGradient(cxp,cyp,0,cxp,cyp,size*.22);
  g.addColorStop(0,mix(col,.85*puls));g.addColorStop(1,mix(col,0));
  x.fillStyle=g;x.beginPath();x.arc(cxp,cyp,size*.22,0,7);x.fill();
}
function avLoop(){
  if(RM.matches){FST==="idle";}
  const a=$("facAv"),d=$("facDot");
  if(a)drawAv(a,88); if(d)drawAv(d,36);
  requestAnimationFrame(avLoop);
}

/* --- contextul pe care îl vede facilitatorul --- */
function facCtx(){
  const s=sec(),ro=S.lang==="ro";
  let c=(ro?"CONTEXT\nSector: ":"CONTEXT\nSector: ")+L(s.name)+" — "+L(s.sub)
   +(ro?"\nOrganizația-tip: ":"\nTypical organisation: ")+L(s.org)
   +(ro?"\nÎncadrare NIS2 (orientativ): ":"\nNIS2 scoping (indicative): ")+L(s.nis2)
   +(ro?"\nScor de pregătire: ":"\nReadiness score: ")+readiness(s.id)+"/100"
   +(ro?"\nTraseul utilizatorului: ":"\nUser track: ")+L(UI[S.role])
   +(ro?"\nEcranul curent: ":"\nCurrent screen: ")+L(UI[VIEWS.find(v=>v.id===S.view)?VIEWS.find(v=>v.id===S.view).k:"mc"]);
  const gaps=DOMAINS.map((d,i)=>({d:L(d),g:s.target[i]-s.maturity[i],lv:s.maturity[i]})).sort((a,b)=>b.g-a.g).slice(0,4);
  c+=(ro?"\nDecalajele cele mai mari: ":"\nLargest gaps: ")+gaps.map(g=>g.d+" ("+g.lv+"→"+(g.lv+g.g)+")").join(", ");
  c+=(ro?"\nIndicatori critici: ":"\nCritical indicators: ")+s.kpis.filter(k=>k.st==="crit").map(k=>L(k.n)+" = "+L(k.now)+" (țintă "+L(k.tgt)+")").join("; ");
  if(S.view==="thr"){const th=s.threats[Math.min(S.threat,s.threats.length-1)];
    c+=(ro?"\nAmenințarea selectată: ":"\nSelected threat: ")+L(th.n)+" — "+L(th.vec)+"; "+(ro?"indicatori: ":"indicators: ")+L(th.ind);}
  if(S.view==="cmp")c+=(ro?"\nCadrul aplicabil: ":"\nApplicable framework: ")+s.compliance.map(x=>L(x.act)+" ["+L(UI[x.kind])+"]").join("; ");
  if(S.view==="kit"&&S.kitOpen){
    const k=kitsFor(s).find(z=>z.k===S.kitOpen),sc=KIT_SCHEMA[S.kitOpen],d=kitDoc(s.id,S.kitOpen).data||{};
    c+=(ro?"\nInstrument deschis: ":"\nOpen instrument: ")+L(k.n)+" — "+L(k.p);
    if(sc)c+=(ro?"\nStructura: ":"\nStructure: ")+(sc.type==="table"?sc.cols.map(x=>L(x.n)).join(" | ")
      :sc.type==="check"?sc.items.map(x=>L(x)).join(" / "):sc.fields.map(x=>L(x.n)).join(" | "));
    c+=(ro?"\nCompletat până acum: ":"\nFilled so far: ")+JSON.stringify(d).slice(0,1400);
  }
  if(S.view==="sim"&&S.sim.step>=0&&!S.sim.done){
    const sp=scn(),st=sp.steps[S.sim.step],ans=S.sim.log.some(l=>l.step===S.sim.step);
    c+=(ro?"\nScenariu: ":"\nScenario: ")+L(sp.title)+" — "+L(sp.brief)
     +(ro?"\nMomentul: ":"\nMoment: ")+L(st.tp)+" "+L(st.ck)+" — "+L(st.msg)
     +(ro?"\nÎntrebarea pusă participantului: ":"\nQuestion put to the participant: ")+L(st.q);
    c+=ans?(ro?"\nParticipantul A DECIS deja la acest inject. Poți discuta liber opțiunile și consecințele."
              :"\nThe participant HAS ALREADY decided on this inject. You may discuss the options and consequences freely.")
          :(ro?"\nATENȚIE: participantul NU a decis încă. NU evalua opțiunile, NU sugera care e bună, NU anticipa consecința. Reformulează situația, întreabă ce informație îi lipsește, amintește-i ce e în joc. Atât."
              :"\nIMPORTANT: the participant has NOT decided yet. Do NOT evaluate the options, do NOT hint at which is right, do NOT preview the consequence. Reframe the situation, ask what information they are missing, remind them what is at stake. Nothing more.");
  }
  if(S.sim.done){c+=(ro?"\nDebrief: ":"\nDebrief: ")+axKeys().map(k=>L(AXK[k])+" "+S.sim.ax[k]).join(", ");}
  return c;
}
function facRules(){
  const ro=S.lang==="ro";
  return (ro
   ?`Ești facilitatorul unui exercițiu de reziliență cibernetică, în platforma Cyber-Bridge Range. Nu ești un asistent general.
REGULI:
1. Răspunde în română. Scurt: 2-5 propoziții, maximum 120 de cuvinte. Un facilitator nu ține prelegeri.
2. Vorbește concret, pentru organizația din context, nu în general. Folosește cifrele și decalajele reale de mai jos.
3. Nu presupune că există CISO, SOC, SIEM sau buget. Dacă recomanzi ceva, spune cine îl face într-o organizație de această dimensiune.
4. Separă strict: cerință legală / cerință de standard / bună practică. Nu transforma niciodată o recomandare în obligație.
5. Pentru orice referință legală spune că se verifică în textul în vigoare, la EUR-Lex și la autoritatea națională. Nu inventa articole, termene sau cifre. Dacă nu știi, spune.
6. Fără statistici inventate. Fără exclamații. Fără laude.
7. Dacă întrebarea nu are legătură cu exercițiul sau cu securitatea organizației, spune asta într-o propoziție și readu discuția la ecranul curent.`
   :`You are the facilitator of a cyber resilience exercise, inside the Cyber-Bridge Range platform. You are not a general assistant.
RULES:
1. Answer in English. Short: 2-5 sentences, 120 words maximum. A facilitator does not lecture.
2. Be concrete about the organisation in the context below, not generic. Use its real numbers and gaps.
3. Do not assume a CISO, SOC, SIEM or budget exists. If you recommend something, say who does it in an organisation of this size.
4. Keep strictly separate: legal requirement / standard requirement / good practice. Never turn a recommendation into an obligation.
5. For any legal reference, say it must be verified against the text in force, in EUR-Lex and with the national authority. Never invent articles, deadlines or figures. If you do not know, say so.
6. No invented statistics. No exclamations. No praise.
7. If the question is unrelated to the exercise or to the organisation's security, say so in one sentence and bring it back to the current screen.`)
  +"\n\n"+facCtx();
}

function facRender(){
  const log=$("facLog");if(!log)return;
  log.innerHTML=FTURNS.map(m=>m.role==="user"
    ?`<div class="fmsg me">${esc(m.content)}</div>`
    :`<div class="fmsg it">${esc(m.content)}</div>`).join("")
    ||`<div class="fmsg it">${esc(L(FUI.hello))}</div>`;
  log.scrollTop=log.scrollHeight;
}
function facSug(){
  const el=$("facSug");if(!el)return;
  let list=SUG[S.view]||SUG.mc;
  if(S.view==="kit"&&S.kitOpen)list=SUG.kit;
  el.innerHTML=(FBUSY?"":list.map(q=>`<button data-fq="${esc(L(q))}">${esc(L(q))}</button>`).join(""))
   +((!FBUSY&&S.view==="kit"&&S.kitOpen&&KIT_SCHEMA[S.kitOpen])
     ?`<button data-fdraft="1" style="border-color:rgba(155,107,255,.42);color:#D2BCFF">✦ ${esc(L(FUI.draftBtn))}</button>`:"");
}
function facChrome(){
  const b=$("facBtn");if(!b)return;
  b.hidden=!SAMPLE;
  $("facBtnLab").textContent=L(FUI.ask);
  $("facRole").textContent=L(FUI.role).toUpperCase();
  $("facIn").placeholder=L(FUI.ph);
  $("facNote").textContent=L(FUI.cost);
  $("facSpk").title=L(FUI.speak);
  facSug();
}
function facOpen(v){
  FACON=v;const p=$("fac");p.hidden=!v;p.classList.toggle("on",v);
  $("facBtn").setAttribute("aria-expanded",String(v));
  if(v){facRender();facSug();setTimeout(()=>$("facIn").focus(),260);}
}
function say(txt){
  if(!FSPK||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);u.lang=S.lang==="ro"?"ro-RO":"en-GB";u.rate=1.02;
    speechSynthesis.speak(u);}catch(e){}
}
async function facAsk(q){
  if(FBUSY||!SAMPLE||!q.trim())return;
  FBUSY=true;FST="thinking";FTURNS.push({role:"user",content:q.trim()});facRender();facSug();
  const log=$("facLog");
  const bub=document.createElement("div");bub.className="fthink";bub.textContent=L(FUI.thinking);
  log.appendChild(bub);log.scrollTop=log.scrollHeight;
  FCTL=new AbortController();
  const turns=[{role:"user",content:facRules()}].concat(FTURNS.slice(-8));
  try{
    const r=await SAMPLE(turns,{signal:FCTL.signal,cache:false,modelTier:"default",
      onText:({text})=>{FST="speaking";bub.className="fmsg it";bub.textContent=text;log.scrollTop=log.scrollHeight;}});
    FTURNS.push({role:"assistant",content:r.text});say(r.text);
  }catch(e){
    const code=e&&e.code;
    if(code==="cancelled"){ if(e.text)FTURNS.push({role:"assistant",content:e.text}); }
    else{
      const m=code==="rate_limited"?L(FUI.errRate)
        :(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled")?L(FUI.off)
        :L(FUI.errGen);
      if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled"){SAMPLE=null;facChrome();}
      bub.className="fmsg err";bub.textContent=m;
      FBUSY=false;FST="idle";facSug();return;
    }
  }
  FBUSY=false;FST="idle";facRender();facSug();
}
async function facDraft(){
  if(FBUSY||!SAMPLE||!S.kitOpen)return;
  const s=sec(),sc=KIT_SCHEMA[S.kitOpen],k=kitsFor(s).find(z=>z.k===S.kitOpen),ro=S.lang==="ro";
  FBUSY=true;FST="thinking";facSug();
  const log=$("facLog");const bub=document.createElement("div");bub.className="fthink";
  bub.textContent=L(FUI.thinking);log.appendChild(bub);log.scrollTop=log.scrollHeight;
  let ask,shape;
  if(sc.type==="table"){shape='{"rows":[{'+sc.cols.map(c=>'"'+c.k+'":"…"').join(",")+'}]}';
    ask=(ro?"Propune 5 rânduri plauzibile pentru acest tabel, specifice organizației din context. Coloane: "
           :"Propose 5 plausible rows for this table, specific to the organisation in the context. Columns: ")
      +sc.cols.map(c=>c.k+" = "+L(c.n)).join("; ");}
  else if(sc.type==="check"){FBUSY=false;FST="idle";bub.remove();facSug();return;}
  else{shape='{'+sc.fields.map(f=>'"'+f.k+'":"…"').join(",")+'}';
    ask=(ro?"Propune un conținut scurt și concret pentru fiecare câmp, specific organizației din context. Câmpuri: "
           :"Propose short, concrete content for each field, specific to the organisation in the context. Fields: ")
      +sc.fields.map(f=>f.k+" = "+L(f.n)).join("; ");}
  const p=facRules()+"\n\n"+ask+(ro
    ?"\n\nRăspunde DOAR cu JSON de forma "+shape+". Fără text în jur. Scurt în fiecare celulă. Nu inventa cifre exacte pe care nu le poți susține; unde nu știi, scrie ce trebuie stabilit."
    :"\n\nReply with ONLY JSON of the form "+shape+". No surrounding text. Keep each cell short. Do not invent exact figures you cannot support; where unknown, write what must be established.");
  try{
    const d=await SAMPLE.json(p,{cache:false,modelTier:"default"});
    const doc=kitDoc(s.id,S.kitOpen),cur=doc.data||{};
    if(sc.type==="table"&&d&&Array.isArray(d.rows)){
      const keep=(cur.rows||[]).filter(r=>Object.values(r).some(v=>String(v||"").trim()));
      cur.rows=keep.concat(d.rows.slice(0,8).map(r=>{const o={};sc.cols.forEach(c=>o[c.k]=String(r[c.k]==null?"":r[c.k]));return o;}));
    } else if(sc.type==="form"&&d&&typeof d==="object"){
      sc.fields.forEach(f=>{if(!String(cur[f.k]||"").trim()&&d[f.k]!=null)cur[f.k]=String(d[f.k]);});
    }
    kitWrite(s.id,S.kitOpen,{status:doc.status==="todo"?"prog":doc.status,data:cur});
    bub.className="fmsg it";bub.textContent=L(FUI.drafted);
    FTURNS.push({role:"assistant",content:L(FUI.drafted)});
    FBUSY=false;FST="idle";render();facOpen(true);return;
  }catch(e){
    bub.className="fmsg err";bub.textContent=(e&&e.code==="rate_limited")?L(FUI.errRate):L(FUI.errGen);
  }
  FBUSY=false;FST="idle";facSug();
}

(async function(){
  try{ SAMPLE=window.claude&&claude.use?await claude.use("sample"):null; }catch(e){ SAMPLE=null; }
  facChrome();avLoop();
})();
$("facBtn").addEventListener("click",()=>facOpen(!FACON));
$("facX").addEventListener("click",()=>{if(FCTL&&FBUSY)FCTL.abort();facOpen(false);});
$("facSend").addEventListener("click",()=>{const i=$("facIn");const v=i.value;i.value="";facAsk(v);});
$("facIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("facSend").click();}});
$("facSpk").addEventListener("click",e=>{FSPK=!FSPK;e.currentTarget.setAttribute("aria-pressed",String(FSPK));
  if(!FSPK&&window.speechSynthesis)try{speechSynthesis.cancel();}catch(x){}});
$("facSug").addEventListener("click",e=>{
  const q=e.target.closest("[data-fq]");if(q){facAsk(q.dataset.fq);return;}
  if(e.target.closest("[data-fdraft]"))facDraft();});

render();
</script>
