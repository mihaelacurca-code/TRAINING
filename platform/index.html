<title>Cyber-Bridge Range</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg-deep:#05070D; --bg-base:#0A0E17; --bg-raised:#111726; --bg-overlay:#161E30;
  --glass:rgba(11,15,25,.78);
  --bd:rgba(145,175,220,.14); --bd-strong:rgba(145,175,220,.30);
  --tx:#E8EEF9; --tx2:#A9B6CC; --tx3:#7C8AA3; --tx-inv:#05070D;
  --info:#38E1FF; --ok:#2EE6C4; --sim:#9B6BFF; --warn:#FFB547; --crit:#FF6B4A; --idle:#7C8AA3;
  --amb:#38E1FF;
  --disp:"Chakra Petch",-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-sm:6px; --r-md:12px; --r-lg:20px; --rail:252px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-base);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--tx3)}
.spacer{flex:1 1 auto}

/* ambient atmosphere layer */
#amb{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.85}
#veil{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1200px 700px at 78% -10%,rgba(56,225,255,.07),transparent 60%),
             radial-gradient(900px 600px at 4% 108%,rgba(155,107,255,.07),transparent 58%);
  transition:background .9s ease}
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) 1fr;min-height:100%}
.app.focus{grid-template-columns:1fr}
.app.focus .rail{display:none}

.rail{border-right:1px solid var(--bd);background:rgba(5,7,13,.72);backdrop-filter:blur(14px);
  padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{width:28px;height:28px;flex:none}
.brand b{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.04em;display:block;line-height:1.15}
.brand span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-sm);
  color:var(--tx2);font-size:13.5px;border:1px solid transparent;transition:background .12s,color .12s}
.nav button:hover{background:rgba(145,175,220,.06);color:var(--tx)}
.nav button[aria-current="true"]{background:color-mix(in srgb,var(--amb) 12%,transparent);border-color:color-mix(in srgb,var(--amb) 30%,transparent);color:var(--tx)}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--idle);flex:none}
.nav button[aria-current="true"] .dot{background:var(--amb);box-shadow:0 0 10px var(--amb)}
.rail-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--bd)}

.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--bd);
  background:var(--glass);backdrop-filter:blur(18px);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.sel{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--bd);border-radius:999px;background:rgba(5,7,13,.6)}
.sel select{background:none;border:none;color:var(--tx);font:inherit;font-size:13px;padding:1px 2px;cursor:pointer;max-width:200px}
.sel select option{background:#111726;color:#E8EEF9}
.roles{display:flex;gap:3px;padding:3px;border:1px solid var(--bd);border-radius:999px;background:rgba(5,7,13,.6)}
.roles button{padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--tx3)}
.roles button[aria-pressed="true"]{background:color-mix(in srgb,var(--amb) 15%,transparent);color:var(--tx)}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--bd);border-radius:999px;background:rgba(5,7,13,.6)}
.lang button{padding:4px 9px;border-radius:999px;font-family:var(--mono);font-size:11.5px;color:var(--tx3);letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:rgba(232,238,249,.12);color:var(--tx)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--bd);background:rgba(5,7,13,.6);font-size:12.5px;color:var(--tx2)}
.chip .val{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--tx);font-weight:600}

main{padding:26px 22px 64px;max-width:1460px;width:100%}
.view{display:flex;flex-direction:column;gap:20px}
.head h1{font-size:27px;font-weight:600}
.head p{margin:6px 0 0;color:var(--tx2);max-width:70ch}

.panel{background:rgba(17,23,38,.80);border:1px solid var(--bd);border-radius:var(--r-lg);padding:20px;backdrop-filter:blur(10px)}
.panel.flush{padding:0;overflow:hidden}
.panel h3{font-size:15px;font-weight:600;margin-bottom:3px}
.panel .sub{color:var(--tx3);font-size:12.5px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

.mark{display:inline-block;width:9px;height:9px;flex:none;background:currentColor}
.mark.info{border-radius:50%;color:var(--info)}
.mark.ok{color:var(--ok);clip-path:polygon(14% 46%,0 60%,40% 100%,100% 22%,86% 8%,38% 70%)}
.mark.sim{color:var(--sim);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.mark.warn{color:var(--warn);clip-path:polygon(50% 4%,100% 96%,0 96%)}
.mark.crit{color:var(--crit);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.mark.idle{color:var(--idle);height:3px;align-self:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-family:var(--mono);border:1px solid var(--bd);color:var(--tx2);white-space:nowrap}
.pill.crit{border-color:rgba(255,107,74,.42);color:#FFC2B1}
.pill.warn{border-color:rgba(255,181,71,.42);color:#FFD79B}
.pill.ok{border-color:rgba(46,230,196,.40);color:#A8F2E3}
.pill.info{border-color:rgba(56,225,255,.40);color:#B3EEFB}
.pill.sim{border-color:rgba(155,107,255,.44);color:#D2BCFF}
.pill.idle{color:var(--tx3)}

.mc{display:grid;grid-template-columns:minmax(258px,318px) 1fr;gap:16px;align-items:start}
.ring{width:190px;height:190px;display:block;margin:0 auto}
.ring .track{fill:none;stroke:rgba(145,175,220,.13);stroke-width:12}
.ring .prog{fill:none;stroke:var(--amb);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .9s cubic-bezier(.16,1,.3,1)}
.ring-val{font-family:var(--disp);font-size:42px;font-weight:700;fill:var(--tx);font-variant-numeric:tabular-nums}
.ring-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;fill:var(--tx3)}
.segs{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.seg{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:12.5px}
.seg .bar{grid-column:1/-1;height:4px;border-radius:999px;background:rgba(145,175,220,.13);overflow:hidden}
.seg .bar i{display:block;height:100%;border-radius:999px;background:var(--amb)}
.seg .n{font-family:var(--mono);color:var(--tx3);font-variant-numeric:tabular-nums}

.nba{border:1px solid color-mix(in srgb,var(--amb) 32%,transparent);border-radius:var(--r-lg);padding:20px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--amb) 10%,transparent),rgba(155,107,255,.06))}
.nba h3{font-size:19px;margin:8px 0 6px}
.nba p{margin:0 0 16px;color:var(--tx2);max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border-radius:var(--r-sm);background:var(--amb);color:var(--tx-inv);font-weight:600;font-size:14px;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px color-mix(in srgb,var(--amb) 30%,transparent)}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--bd-strong)}
.btn.ghost:hover{background:rgba(145,175,220,.07);box-shadow:none}
.btn.sim{background:var(--sim);color:#fff}

.alerts{display:flex;flex-direction:column}
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-top:1px solid var(--bd)}
.alert:first-child{border-top:none}
.alert .mark{margin-top:7px}
.alert p{margin:0;font-size:13.5px}
.alert .meta{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-top:3px}

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(248px,1fr))}
.card{display:flex;flex-direction:column;gap:9px;padding:16px;border-radius:var(--r-md);border:1px solid var(--bd);
  background:rgba(22,30,48,.78);text-align:left;width:100%;transition:border-color .14s,transform .14s}
.card:hover{border-color:var(--bd-strong);transform:translateY(-2px)}
.card h4{font-size:14.5px;font-weight:600}
.card p{margin:0;font-size:12.5px;color:var(--tx3);flex:1}
.card .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:580px;font-size:13px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--tx3);font-weight:500;white-space:nowrap}
tbody tr:hover{background:rgba(145,175,220,.04)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.tmap{display:grid;grid-template-columns:1fr minmax(240px,306px);gap:16px}
.plot{width:100%;height:auto;display:block}
.plot text{font-family:var(--mono);font-size:9px;fill:var(--tx3)}
.plot .axis{stroke:rgba(145,175,220,.16)}
.plot .gl{stroke:rgba(145,175,220,.07)}
.node{cursor:pointer}
.node text{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tlegend{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:2px;grid-template-columns:repeat(auto-fit,minmax(236px,1fr))}
.tlegend button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 8px;border-radius:var(--r-sm);font-size:12.5px;color:var(--tx2);border:1px solid transparent}
.tlegend button:hover{background:rgba(145,175,220,.06);color:var(--tx)}
.tlegend button[aria-pressed="true"]{background:color-mix(in srgb,var(--amb) 10%,transparent);border-color:color-mix(in srgb,var(--amb) 28%,transparent);color:var(--tx)}
.tlegend .tn{width:17px;flex:none;text-align:center;font-size:11px;color:var(--tx3);font-family:var(--mono)}
.tlegend .tl{overflow-wrap:anywhere}

.sim-stage{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sim-bar{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:12px 18px;border:1px solid rgba(155,107,255,.32);border-radius:var(--r-md);
  background:linear-gradient(90deg,rgba(155,107,255,.12),rgba(17,23,38,.66))}
.clock{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tplus{font-family:var(--mono);font-size:12px;color:var(--sim);letter-spacing:.08em}
.timer{font-family:var(--mono);font-size:13px;color:var(--warn);font-variant-numeric:tabular-nums}
.timer.off{color:var(--tx3)}
.rt{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.rt i{width:24px;height:3px;border-radius:2px;background:rgba(145,175,220,.18);display:block}
.rt i.done{background:var(--sim)}
.rt i.now{background:var(--tx);box-shadow:0 0 8px var(--tx)}

.inject{border:1px solid var(--bd);border-radius:var(--r-lg);background:rgba(17,23,38,.86);overflow:hidden}
.inject-h{display:flex;gap:10px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--bd);background:rgba(5,7,13,.5);flex-wrap:wrap}
.inject-b{padding:20px}
.inject-b .msg{font-size:16px;line-height:1.65;margin:0}
.inject-b .q{font-family:var(--disp);font-size:17px;font-weight:600;margin:18px 0 0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--bd);
  background:rgba(22,30,48,.8);text-align:left;width:100%;transition:border-color .13s,background .13s}
.opt:hover:not(:disabled){border-color:var(--sim);background:rgba(155,107,255,.09)}
.opt:disabled{opacity:.38;cursor:default}
.opt.chosen{opacity:1;border-color:var(--sim);background:rgba(155,107,255,.14)}
.opt.chosen .k{color:var(--sim)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--tx3);padding-top:1px;display:flex;align-items:center;gap:5px}

.consq{border:1px solid var(--bd-strong);border-radius:var(--r-lg);background:rgba(22,30,48,.86);padding:20px;display:flex;flex-direction:column;gap:14px}
.consq .lead{font-size:15.5px;margin:0;line-height:1.65}
.consq .alt{font-size:13.5px;color:var(--tx2);margin:0;padding-left:14px;border-left:2px solid var(--bd-strong)}
.deltas{display:flex;gap:8px;flex-wrap:wrap}
.dlt{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--bd);font-variant-numeric:tabular-nums}
.dlt.up{color:#A8F2E3;border-color:rgba(46,230,196,.40)}
.dlt.dn{color:#FFC2B1;border-color:rgba(255,107,74,.40)}
.dlt.z{color:var(--tx3)}
.axes{display:grid;gap:11px}
.ax{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:13px}
.ax .bar{grid-column:1/-1;height:6px;border-radius:999px;background:rgba(145,175,220,.13);overflow:hidden}
.ax .bar i{display:block;height:100%;border-radius:999px;transition:width .7s cubic-bezier(.16,1,.3,1)}
.ax .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--tx2)}

.mx table{min-width:640px}
.cell{display:flex;gap:3px}
.lv{width:22px;height:22px;border-radius:4px;background:rgba(145,175,220,.09);border:1px solid transparent;position:relative}
.lv.on{border-color:rgba(232,238,249,.22)}
.lv.cur{outline:2px solid var(--tx);outline-offset:1px}
.lv.tgt::after{content:"";position:absolute;inset:4px;border:1.5px dashed rgba(232,238,249,.7);border-radius:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx3);padding:0 20px 18px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.note{font-size:12.5px;color:var(--tx3);border-left:2px solid var(--bd-strong);padding-left:12px;margin:0}
.sgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
.scard{display:flex;flex-direction:column;gap:10px;padding:17px;border-radius:var(--r-md);border:1px solid var(--bd);
  background:rgba(22,30,48,.74);text-align:left;transition:border-color .14s,transform .14s;position:relative;overflow:hidden}
.scard:hover{transform:translateY(-2px)}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc)}
.scard[aria-current="true"]{border-color:var(--sc)}
.scard h4{font-size:15px;font-weight:600}
.scard p{margin:0;font-size:12.5px;color:var(--tx3);flex:1}
.scard .rd{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--sc)}

@media (max-width:940px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;overflow-x:auto;padding:12px 16px}
  .rail .brand{flex:none}
  .nav{flex-direction:row;gap:4px}
  .nav button{white-space:nowrap;padding:7px 11px;font-size:13px}
  .rail-foot{display:none}
  .mc,.tmap{grid-template-columns:1fr}
  main{padding:20px 16px 56px}
  .topbar{padding:10px 16px}
  .sel select{max-width:150px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

<canvas id="amb" aria-hidden="true"></canvas>
<div id="veil" aria-hidden="true"></div>

<div class="app" id="app">
  <aside class="rail">
    <div class="brand">
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <path d="M14 2 4 6.5v7c0 6 4.4 10.4 10 11.5 5.6-1.1 10-5.5 10-11.5v-7z" fill="none" stroke="#38E1FF" stroke-width="1.3"/>
        <path d="M7.5 13.5h13M10.5 13.5V9M17.5 13.5V9M14 13.5v7" stroke="#9B6BFF" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <div><b>CYBER-BRIDGE</b><span>Range</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <p class="eyebrow" id="demoT" style="margin:0 0 6px"></p>
      <p id="demoB" style="margin:0;font-size:12px;color:var(--tx3);line-height:1.5"></p>
    </div>
  </aside>
  <div>
    <header class="topbar">
      <span class="sel">
        <span class="mark info" aria-hidden="true"></span>
        <select id="secSel" aria-label="Sector"></select>
      </span>
      <span class="spacer"></span>
      <div class="roles" id="roles" role="group"></div>
      <div class="lang" role="group">
        <button data-lang="ro" aria-pressed="true">RO</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
      <span class="chip"><span class="mark info"></span><span id="rdLab"></span> <span class="val" id="topScore">—</span></span>
    </header>
    <main id="main"></main>
  </div>
</div>

<script src="data/sectors.js"></script>
<script src="data/sectors-b.js"></script>
<script src="data/scenarios.js"></script>
<script src="data/scenarios-b.js"></script>
<script>
"use strict";
const t=(ro,en)=>({ro:ro,en:en});

/* ---------- i18n ---------- */
const UI={
 mc:t("Mission Control","Mission Control"), sectors:t("Sectoare","Sectors"),
 thr:t("Peisajul amenințărilor","Threat Landscape"), sim:t("Laborator de simulare","Simulation Lab"),
 mat:t("Pregătire","Readiness"), kit:t("Seif de instrumente","Toolkit Vault"), cmp:t("Conformitate","Compliance"),
 mgmt:t("Management","Management"), tech:t("Tehnic","Technical"), hyg:t("Igienă","Hygiene"),
 readiness:t("Pregătire","Readiness"),
 demoT:t("Sesiune demo","Demo session"),
 demoB:t("Date de exemplu pentru profilul afișat. Progresul se păstrează doar în acest browser.","Example data for the displayed profile. Progress is kept in this browser only."),
 mcH:t("Starea de pregătire","State of readiness"),
 nextStep:t("Următorul pas recomandat","Recommended next step"),
 runScn:t("Rulează scenariul sectorial","Run the sector scenario"),
 runScnP:t("Decizii sub ceas, cu consecințe. La final primești un debrief pe patru axe și instrumentele care acoperă lacunele găsite.","Decisions against the clock, with consequences. At the end you get a four-axis debrief and the instruments that close the gaps found."),
 enterScn:t("Intră în scenariu","Enter the scenario"),
 doneH:t("Închide lacunele pe care le-a scos exercițiul","Close the gaps the exercise exposed"),
 doneP:t("Simularea a arătat unde se rupe lanțul de decizie. Seiful conține instrumentele care transformă constatările în proceduri scrise.","The simulation showed where the decision chain breaks. The vault holds the instruments that turn findings into written procedures."),
 openKit:t("Deschide seiful","Open the vault"),
 signals:t("Semnale active","Active signals"),
 signalsS:t("Din evaluarea de maturitate și din indicatorii colectați","From the maturity assessment and the collected indicators"),
 missions:t("Misiuni pentru traseul","Missions for the"), missionsB:t("","track"),
 missionsS:t("Ordonate după reducerea de risc pe unitatea de efort","Ordered by risk reduction per unit of effort"),
 gapTo:t("niv.","lvl"),
 secH:t("Zece sectoare, același nucleu metodologic","Ten sectors, one methodological core"),

function readiness(sid){
  const s=SECTORS.find(x=>x.id===sid)||sec();
  const base=s.maturity.reduce((a,b)=>a+b,0)/(16*5)*100;
  const ks=kitsFor(s), m=S.kits[s.id]||{};
  const kd=ks.filter(k=>m[k.k]==="done").length/ks.length*100;
  let sv=50;
  if(s.id===S.sector&&Object.keys(S.sim.ax).length){
    const v=Object.values(S.sim.ax); sv=v.reduce((a,b)=>a+b,0)/v.length;
  }
  return Math.round(base*.55+sv*.25+kd*.20);
}

/* ---------- atmosferă ---------- */
const cv=document.getElementById("amb"),cx=cv.getContext("2d");
const RM=window.matchMedia("(prefers-reduced-motion: reduce)");
let P=[],W=0,H=0,tick=0,alarm=0,raf=null;
function hueOf(){return sec().hue;}
function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cx.scale(1,1);}
function seed(){
  const m=sec().motion, n=m==="mesh"?64:m==="ticker"?110:m==="paper"?34:m==="struct"?70:56;
  P=[];for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5),vy:(Math.random()-.5),r:Math.random()*2+.7,p:Math.random()*Math.PI*2,s:Math.random()});
}
function draw(){
  const m=sec().motion,h=hueOf(),dp=devicePixelRatio;
  cx.clearRect(0,0,W,H);
  const hue=h+alarm*(-h+8), sat=alarm>.3?85:60, al=.30+alarm*.35;
  const col=(a)=>`hsla(${hue},${sat}%,${62+alarm*6}%,${a})`;
  tick+=RM.matches?0:1;
  const sp=1+alarm*1.8;
  if(m==="mesh"){
    for(const p of P){p.x+=p.vx*.22*sp*dp;p.y+=p.vy*.22*sp*dp;
      if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;}
    cx.lineWidth=dp*.6;
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
      const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=Math.hypot(dx,dy);
      if(d<170*dp){cx.strokeStyle=col(al*.22*(1-d/(170*dp)));cx.beginPath();cx.moveTo(P[i].x,P[i].y);cx.lineTo(P[j].x,P[j].y);cx.stroke();}}
    for(const p of P){cx.fillStyle=col(al*.6);cx.beginPath();cx.arc(p.x,p.y,p.r*dp,0,7);cx.fill();}
  }else if(m==="flow"||m==="ticker"){
    const fast=m==="ticker";
    for(const p of P){p.x+=(fast?2.4:.9)*sp*dp*(0.5+p.s);
      if(p.x>W+60*dp)p.x=-60*dp;
      const len=(fast?26:60)*dp*(0.4+p.s);
      cx.strokeStyle=col(al*(fast?.5:.35));cx.lineWidth=dp*(fast?.9:.7);
      cx.beginPath();cx.moveTo(p.x-len,p.y);cx.lineTo(p.x,p.y);cx.stroke();}
  }else if(m==="grid"||m==="struct"){
    const g=(m==="grid"?96:120)*dp;
    cx.strokeStyle=col(al*.14);cx.lineWidth=dp*.6;
    for(let x=0;x<W;x+=g){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}
    for(let y=0;y<H;y+=g){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}
    for(const p of P){p.p+=.006*sp;const t2=(p.p%1);
      const gx=Math.floor(p.x/g)*g, gy=Math.floor(p.y/g)*g;
      const cxp=p.s>.5?gx+t2*g:gx, cyp=p.s>.5?gy:gy+t2*g;
      cx.fillStyle=col(al*.75);cx.beginPath();cx.arc(cxp,cyp,1.7*dp,0,7);cx.fill();}
  }else if(m==="pulse"){
    for(const p of P){p.p+=.012*sp;
      const r=(Math.sin(p.p)*.5+.5);
      cx.fillStyle=col(al*(.25+r*.5));cx.beginPath();cx.arc(p.x,p.y,(1+r*2.2)*dp,0,7);cx.fill();}
    const bt=(tick%150)/150, ring=bt*Math.max(W,H)*.6;
    cx.strokeStyle=col(al*.16*(1-bt));cx.lineWidth=dp*1.4;
    cx.beginPath();cx.arc(W*.78,H*.12,ring,0,7);cx.stroke();
  }else if(m==="mech"){
    for(const p of P){p.p+=.02*sp;
      const off=Math.sin(p.p)*14*dp;
      cx.strokeStyle=col(al*.42);cx.lineWidth=dp*1.1;
      cx.beginPath();cx.moveTo(p.x,p.y+off);cx.lineTo(p.x,p.y+off+16*dp);cx.stroke();}
  }else if(m==="burst"){
    for(const p of P){p.p+=.008*sp;const t2=p.p%1;
      cx.strokeStyle=col(al*.30*(1-t2));cx.lineWidth=dp*.8;
      cx.beginPath();cx.arc(p.x,p.y,t2*70*dp,0,7);cx.stroke();}
  }else if(m==="paper"){
    for(const p of P){p.y+=.35*sp*dp*(.4+p.s);p.p+=.004;
      if(p.y>H+40*dp)p.y=-40*dp;
      const w=22*dp*(.6+p.s),hh=30*dp*(.6+p.s);
      cx.save();cx.translate(p.x,p.y);cx.rotate(Math.sin(p.p)*.25);
      cx.strokeStyle=col(al*.26);cx.lineWidth=dp*.7;cx.strokeRect(-w/2,-hh/2,w,hh);cx.restore();}
  }else{ /* drift */
    for(const p of P){p.x+=p.vx*.14*sp*dp;p.y+=p.vy*.14*sp*dp;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      cx.fillStyle=col(al*.42);cx.beginPath();cx.arc(p.x,p.y,p.r*1.5*dp,0,7);cx.fill();}
  }
  if(!RM.matches) raf=requestAnimationFrame(draw); else raf=null;
}
function ambient(){
  const h=hueOf();
  document.documentElement.style.setProperty("--amb",`hsl(${h},92%,62%)`);
  document.getElementById("veil").style.background=
    `radial-gradient(1200px 700px at 78% -10%,hsla(${h},90%,60%,.09),transparent 60%),`+
    `radial-gradient(900px 600px at 4% 108%,hsla(${(h+70)%360},80%,62%,.07),transparent 58%)`;
}

addEventListener("resize",()=>{resize();seed();});
resize();seed();ambient();draw();
RM.addEventListener&&RM.addEventListener("change",()=>{if(!raf&&!RM.matches)draw();else{cancelAnimationFrame(raf);raf=null;draw();}});

function missions(s){

  if(crit[0])out.push({n:L(crit[0].n),p:L(t("Indicator critic. Formula și pragul sunt în tabloul de pregătire.","Critical indicator. Formula and threshold are on the readiness board.")),min:20,tag:L(t("Indicator","Indicator")),tone:"warn",v:"mat"});

}

      ${[1,2,3,4,5].map(v=>`<line class="gl" x1="${X(v)}" y1="42" x2="${X(v)}" y2="300"/>`).join("")}

      ${[1,2,3,4,5].map(v=>`<text x="${X(v)}" y="318" text-anchor="middle">${v}</text>`).join("")}
      ${[1,2,3,4,5].map(v=>`<text x="60" y="${Y(v)+3}" text-anchor="end">${v}</text>`).join("")}
      <text x="${(70+X(5))/2}" y="340" text-anchor="middle" style="letter-spacing:.10em">${esc(L(UI.lk))}</text>
      <text x="22" y="171" text-anchor="middle" transform="rotate(-90 22 171)" style="letter-spacing:.10em">${esc(L(UI.im))}</text>
      ${T.map((x,j)=>{const on=j===i,c=x.im>=5?"#FF6B4A":x.im>=4?"#FFB547":x.lk>=4?"#38E1FF":"#7C8AA3";

         <text x="${X(x.lk)}" y="${Y(x.im)+3.5}" text-anchor="middle" style="fill:${on?"#E8EEF9":c};font-size:11px;font-weight:600">${j+1}</text></g>`;}).join("")}
     </svg>
     <ol class="tlegend">${T.map((x,j)=>{const on=j===i,tn=x.im>=5?"crit":x.im>=4?"warn":x.lk>=4?"info":"idle";

        <span class="mark ${tn}"></span><span class="tl">${esc(L(x.n))}</span></button></li>`;}).join("")}</ol>
    </div>
    <div class="panel">
     <span class="pill ${th.im>=5?"crit":th.im>=4?"warn":"info"}"><span class="mark ${th.im>=5?"crit":th.im>=4?"warn":"info"}"></span>${esc(L(UI.impact))} ${th.im}/5 · ${esc(L(UI.likeli))} ${th.lk}/5</span>
     <h3 style="margin-top:12px;font-size:17px">${esc(L(th.n))}</h3>

/* Simulation */
function axKeys(){const o=scn().steps[0].o[0].d;return Object.keys(o);}
function vSim(){ if(S.sim.done&&S.sim.sector===S.sector)return simDeb(); if(S.sim.step<0||S.sim.sector!==S.sector)return simIntro(); return simStep(); }
function simIntro(){
  const sp=scn(),ks=axKeys();
  return `<div class="view sim-stage">
   <div class="head"><p class="eyebrow">${esc(L(UI.scn))} · ${esc(L(sec().name))}</p>
    <h1>${esc(L(sp.title))}</h1><p>${esc(L(sec().org))}</p></div>
   <div class="panel" style="border-color:rgba(155,107,255,.30)">
    <p style="margin:0 0 16px;font-size:16px;line-height:1.7">${esc(L(sp.brief))}</p>
    <div class="grid g3" style="margin-bottom:18px">
     <div><p class="eyebrow">${esc(L(UI.duration))}</p><p class="mono" style="margin:2px 0 0;font-size:15px">≈ 15 ${esc(L(UI.mins))}</p></div>
     <div><p class="eyebrow">${esc(L(UI.decisions))}</p><p class="mono" style="margin:2px 0 0;font-size:15px">${sp.steps.length} ${esc(L(UI.points))}</p></div>
     <div><p class="eyebrow">${esc(L(UI.evalAx))}</p><p class="mono" style="margin:2px 0 0;font-size:15px">4 ${esc(L(UI.axesW))}</p></div></div>
    <p class="note">${esc(L(UI.noSol))}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
     <button class="btn sim" data-sim="start">${esc(L(UI.start))} <span aria-hidden="true">→</span></button>
     <button class="btn ghost" data-sim="tt">${esc(S.timerOn?L(UI.stopClock):L(UI.startClock))}</button></div></div>
   <div class="panel"><h3>${esc(L(UI.whatEval))}</h3><p class="sub">${esc(L(UI.whatEvalS))}</p>
    <div class="axes">${ks.map(k=>`<div class="ax"><span>${esc(L(AXK[k]))}</span><span class="n">50</span>
      <span class="bar"><i style="width:50%;background:${AXC[k]}"></i></span></div>`).join("")}</div></div></div>`;
}
function simStep(){
  const sp=scn(),st=sp.steps[S.sim.step],last=S.sim.log[S.sim.log.length-1],show=last&&last.step===S.sim.step;
  return `<div class="view sim-stage">
   <div class="sim-bar"><span class="tplus">${esc(L(st.tp))}</span><span class="clock">${esc(L(st.ck))}</span>
    <span class="rt" aria-hidden="true">${sp.steps.map((_,i)=>`<i class="${i<S.sim.step?"done":i===S.sim.step?"now":""}"></i>`).join("")}</span>
    <span class="spacer"></span>
    <span class="timer ${S.timerOn?"":"off"}" id="tmr">${S.timerOn?"90s":esc(L(UI.clockOff))}</span>
    <button class="btn ghost" style="padding:6px 12px;font-size:12.5px" data-sim="tt">${esc(S.timerOn?L(UI.stopClock):L(UI.startClock))}</button>
    <button class="btn ghost" style="padding:6px 12px;font-size:12.5px" data-sim="abort">${esc(L(UI.exit))}</button></div>
   <div class="inject"><div class="inject-h"><span class="mark sim"></span>
     <span class="eyebrow" style="color:var(--tx2)">${esc(L(UI.inject))} ${S.sim.step+1} / ${sp.steps.length}</span>
     <span class="spacer"></span><span class="eyebrow">${esc(L(UI.source))}: ${esc(L(st.src))}</span></div>
    <div class="inject-b"><p class="msg">${esc(L(st.msg))}</p><p class="q">${esc(L(st.q))}</p>
     <div class="opts">${st.o.map((o,j)=>{const pick=show&&last.opt===j;
      return `<button class="opt ${pick?"chosen":""}" data-opt="${j}" ${show?"disabled":""}>
      <span class="k">${String.fromCharCode(65+j)}${pick?'<span class="mark sim"></span>':""}</span>
      <span>${esc(L(o.t))}</span></button>`;}).join("")}</div></div></div>
   ${show?`<div class="consq"><p class="eyebrow">${esc(L(UI.consq))}</p><p class="lead">${esc(last.c)}</p>
    ${last.alt?`<p class="alt"><strong>${esc(L(UI.altern))}:</strong> ${esc(last.alt)}</p>`:""}
    <div class="deltas">${Object.keys(last.d).map(k=>{const v=last.d[k];
      return `<span class="dlt ${v>0?"up":v<0?"dn":"z"}">${esc(L(AXK[k]).split(" ")[0])} ${v>0?"+":""}${v*5}</span>`;}).join("")}</div>
    <button class="btn sim" data-sim="next" style="align-self:flex-start">
     ${esc(S.sim.step+1<sp.steps.length?L(UI.nextInj):L(UI.seeDeb))} <span aria-hidden="true">→</span></button></div>`
    :`<p class="note">${esc(L(UI.decide))}</p>`}</div>`;
}
function simDeb(){
  const sp=scn(),ks=axKeys(),s=sec();
  const worst=ks.slice().sort((a,b)=>S.sim.ax[a]-S.sim.ax[b])[0];
  /* instrumentele recomandate sunt cele care acoperă efectiv axa cea mai slabă */
  const BYAX={data:["ph","acl","pol"],legal:["not","ir","com"],evi:["rw","vnd","acl"]};
  const want=BYAX[worst]||["deg","bc","ir"];
  const all=kitsFor(s);
  const recs=want.map(w=>all.find(k=>k.k===w)).filter(Boolean).slice(0,2)
    .concat((s.extraKits||[]).slice(0,1));
  return `<div class="view sim-stage">
   <div class="head"><p class="eyebrow">${esc(L(UI.debrief))} · ${esc(L(sp.title))}</p>
    <h1>${esc(L(UI.debH))}</h1><p>${esc(L(UI.debP))}</p></div>
   <div class="panel"><h3>${esc(L(UI.fourAx))}</h3><p class="sub">${esc(L(UI.startedAt))}</p>
    <div class="axes">${ks.map(k=>`<div class="ax"><span>${esc(L(AXK[k]))}</span><span class="n">${S.sim.ax[k]}</span>
      <span class="bar"><i style="width:${S.sim.ax[k]}%;background:${AXC[k]}"></i></span></div>`).join("")}</div></div>
   <div class="panel" style="border-color:rgba(255,181,71,.30)"><p class="eyebrow">${esc(L(UI.weakest))}</p>
    <h3 style="font-size:18px;margin:6px 0 8px">${esc(L(AXK[worst]))} · ${S.sim.ax[worst]}/100</h3>
    <p style="margin:0 0 14px;color:var(--tx2)">${esc(L(UI.weakP))}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">
     ${recs.map(r=>`<span class="pill warn"><span class="mark warn"></span>${esc(L(r.n))}</span>`).join("")}</div>
    <button class="btn" data-go="kit">${esc(L(UI.openKit))} <span aria-hidden="true">→</span></button></div>
   <div class="panel flush"><div style="padding:18px 20px 4px"><h3>${esc(L(UI.log))}</h3><p class="sub">${esc(L(UI.logS))}</p></div>
    <div class="tw"><table><thead><tr><th>${esc(L(UI.moment))}</th><th>${esc(L(UI.decision))}</th><th>${esc(L(UI.conseq))}</th></tr></thead>
     <tbody>${S.sim.log.map(l=>`<tr><td class="num">${esc(L(sp.steps[l.step].tp))}<br><span style="color:var(--tx3)">${esc(L(sp.steps[l.step].ck))}</span></td>
      <td style="max-width:280px">${esc(l.t)}</td><td style="color:var(--tx2);max-width:360px">${esc(l.c)}</td></tr>`).join("")}</tbody></table></div></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn ghost" data-sim="reset">${esc(L(UI.again))}</button>
    <button class="btn ghost" data-go="mc">${esc(L(UI.backMc))}</button></div></div>`;
}

     <tbody>${s.kpis.map(k=>`<tr><td><span class="pill ${k.st}"><span class="mark ${k.st}"></span></span> <strong>${esc(L(k.n))}</strong></td>
      <td class="mono" style="font-size:11.5px;color:var(--tx3)">${esc(L(k.f))}</td>
      <td class="num"><strong>${esc(L(k.now))}</strong></td><td class="num" style="color:var(--tx3)">${esc(L(k.tgt))}</td></tr>`).join("")}</tbody></table></div></div>

/* Toolkit */

  const s=sec(),ks=kitsFor(s),lab={todo:L(UI.todo),prog:L(UI.prog),done:L(UI.done)},tone={todo:"idle",prog:"warn",done:"ok"};
  const m=S.kits[s.id]||{},d=ks.filter(k=>m[k.k]==="done").length;

   <div class="head"><p class="eyebrow">${esc(L(UI.kit))} · ${esc(L(s.name))}</p><h1>${esc(L(UI.kitH))}</h1>
    <p>${ks.length} ${esc(L(UI.kitP1))} ${d}/${ks.length} ${esc(L(UI.kitP2))}</p></div>
   <div class="cards">${ks.map(k=>{const st=m[k.k]||"todo";
     return `<button class="card" data-kit="${k.k}"><h4>${esc(L(k.n))}</h4><p>${esc(L(k.p))}</p>

      <span class="mono" style="font-size:11.5px;color:var(--tx3)">${k.min} ${esc(L(UI.mins))}</span></span></button>`;}).join("")}</div>

function vCmp(){

  return `<div class="view">

   <div class="panel flush"><div class="tw"><table>

/* ---------- interacțiune ---------- */
let tid=null,left=90;
function stopTimer(){if(tid){clearInterval(tid);tid=null;}}
function startTimer(){
  stopTimer();const el=document.getElementById("tmr");if(!el)return;
  const answered=S.sim.log.some(l=>l.step===S.sim.step);
  if(!S.timerOn||answered){el.textContent=S.timerOn?L(UI.decided):L(UI.clockOff);el.classList.toggle("off",!S.timerOn);return;}
  left=90;el.classList.remove("off");el.textContent=left+"s";
  tid=setInterval(()=>{left--;const e=document.getElementById("tmr");if(!e){stopTimer();return;}
    e.textContent=left>0?left+"s":L(UI.expired);
    if(left<=0){stopTimer();e.style.color="var(--crit)";}},1000);
}
function choose(j){
  const st=scn().steps[S.sim.step],o=st.o[j];
  if(!Object.keys(S.sim.ax).length)axKeys().forEach(k=>S.sim.ax[k]=50);
  for(const k in o.d)S.sim.ax[k]=Math.max(0,Math.min(100,(S.sim.ax[k]||50)+o.d[k]*5));
  S.sim.log.push({step:S.sim.step,opt:j,t:L(o.t),c:L(o.c),alt:o.alt?L(o.alt):null,d:o.d});
  stopTimer();save();render();
}
function resetSim(start){
  S.sim={sector:S.sector,step:start?0:-1,log:[],ax:{},done:false};
  axKeys().forEach(k=>S.sim.ax[k]=50);
}

document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");if(v){S.view=v.dataset.view;stopTimer();save();render();return;}
  const g=e.target.closest("[data-go]");if(g){S.view=g.dataset.go;save();render();return;}
  const r=e.target.closest("[data-role]");if(r){S.role=r.dataset.role;save();render();return;}
  const la=e.target.closest("[data-lang]");if(la){S.lang=la.dataset.lang;save();render();return;}
  const sc=e.target.closest("[data-sec]");if(sc){S.sector=sc.dataset.sec;S.threat=0;resetSim(false);seed();save();render();return;}
  const th=e.target.closest("[data-thr]");if(th){S.threat=+th.dataset.thr;save();render();return;}
  const op=e.target.closest("[data-opt]");if(op&&!op.disabled){choose(+op.dataset.opt);return;}
  const k=e.target.closest("[data-kit]");if(k){
    const s=sec();S.kits[s.id]=S.kits[s.id]||{};
    const ord=["todo","prog","done"],cur=S.kits[s.id][k.dataset.kit]||"todo";
    S.kits[s.id][k.dataset.kit]=ord[(ord.indexOf(cur)+1)%3];save();render();return;}
  const sm=e.target.closest("[data-sim]");if(sm){
    const a=sm.dataset.sim;
    if(a==="start"||a==="reset")resetSim(true);
    if(a==="next"){if(S.sim.step+1<scn().steps.length)S.sim.step++;else{S.sim.done=true;S.sim.step=-1;}}
    if(a==="tt")S.timerOn=!S.timerOn;
    if(a==="abort"){resetSim(false);stopTimer();}
    save();render();return;}
});
document.getElementById("secSel").addEventListener("change",e=>{
  S.sector=e.target.value;S.threat=0;resetSim(false);seed();save();render();});
document.addEventListener("keydown",e=>{
  const n=e.target.closest("[data-thr]");
  if(n&&(e.key==="Enter"||e.key===" ")){e.preventDefault();S.threat=+n.dataset.thr;save();render();}});

if(!S.sim.sector)resetSim(false);
render();
</script>
