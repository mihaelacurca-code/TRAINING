<title>Redută Cyber Range</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg-deep:#05070D; --bg-base:#0A0E17; --bg-raised:#111726; --bg-overlay:#161E30;
  --glass:rgba(17,23,38,.72);
  --bd:rgba(145,175,220,.14); --bd-strong:rgba(145,175,220,.30);
  --tx:#E8EEF9; --tx2:#A9B6CC; --tx3:#7C8AA3; --tx-inv:#05070D;
  --info:#38E1FF; --ok:#2EE6C4; --sim:#9B6BFF; --warn:#FFB547; --crit:#FF6B4A; --idle:#7C8AA3;
  --m0:#3A4356; --m1:#4E5C7A; --m2:#3E7FA8; --m3:#2E9FB5; --m4:#2EC5A8; --m5:#2EE6C4;
  --disp:"Chakra Petch",-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-sm:6px; --r-md:12px; --r-lg:20px;
  --rail:248px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg-base);color:var(--tx);
  font-family:var(--body);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1100px 620px at 78% -8%,rgba(56,225,255,.10),transparent 62%),
    radial-gradient(900px 540px at 6% 104%,rgba(155,107,255,.10),transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:.01em}
a{color:var(--info)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--tx3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100%}
.app.focus{grid-template-columns:1fr}
.app.focus .rail{display:none}

.rail{
  border-right:1px solid var(--bd);background:var(--bg-deep);
  padding:20px 14px;display:flex;flex-direction:column;gap:22px;
  position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mk{width:26px;height:26px;flex:none}
.brand b{font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:.06em}
.brand span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 10px;border-radius:var(--r-sm);color:var(--tx2);font-size:14px;
  border:1px solid transparent;transition:background .12s,color .12s;
}
.nav button:hover{background:rgba(145,175,220,.06);color:var(--tx)}
.nav button[aria-current="true"]{background:rgba(56,225,255,.10);border-color:rgba(56,225,255,.28);color:var(--tx)}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--idle);flex:none}
.nav button[aria-current="true"] .dot{background:var(--info);box-shadow:0 0 10px var(--info)}
.rail-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--bd)}

.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 24px;border-bottom:1px solid var(--bd);
  background:var(--glass);backdrop-filter:blur(18px);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
}
.crumb{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase}
.crumb b{color:var(--tx2);font-weight:500}
.spacer{flex:1 1 auto}
.roles{display:flex;gap:3px;padding:3px;border:1px solid var(--bd);border-radius:999px;background:rgba(5,7,13,.5)}
.roles button{padding:5px 12px;border-radius:999px;font-size:12.5px;color:var(--tx3)}
.roles button[aria-pressed="true"]{background:rgba(56,225,255,.13);color:var(--tx)}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--bd);background:rgba(5,7,13,.5);font-size:12.5px;color:var(--tx2);
}
.chip .val{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--tx);font-weight:600}

main{padding:26px 24px 64px;max-width:1440px;width:100%}
.view{display:flex;flex-direction:column;gap:22px}
.head h1{font-size:27px;font-weight:600}
.head p{margin:6px 0 0;color:var(--tx2);max-width:68ch}

/* ---------- surfaces ---------- */
.panel{background:var(--bg-raised);border:1px solid var(--bd);border-radius:var(--r-lg);padding:20px}
.panel.flush{padding:0;overflow:hidden}
.panel h3{font-size:15px;font-weight:600;margin-bottom:3px}
.panel .sub{color:var(--tx3);font-size:12.5px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

/* status marks: shape + colour, never colour alone */
.mark{display:inline-block;width:9px;height:9px;flex:none;background:currentColor}
.mark.info{border-radius:50%;color:var(--info)}
.mark.ok{border-radius:50%;color:var(--ok);clip-path:polygon(14% 46%,0 60%,40% 100%,100% 22%,86% 8%,38% 70%)}
.mark.sim{color:var(--sim);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.mark.warn{color:var(--warn);clip-path:polygon(50% 4%,100% 96%,0 96%)}
.mark.crit{color:var(--crit);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.mark.idle{color:var(--idle);height:3px;align-self:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-family:var(--mono);letter-spacing:.03em;border:1px solid var(--bd);color:var(--tx2);white-space:nowrap}
.pill.crit{border-color:rgba(255,107,74,.42);color:#FFC2B1}
.pill.warn{border-color:rgba(255,181,71,.42);color:#FFD79B}
.pill.ok{border-color:rgba(46,230,196,.40);color:#A8F2E3}
.pill.info{border-color:rgba(56,225,255,.40);color:#B3EEFB}
.pill.sim{border-color:rgba(155,107,255,.44);color:#D2BCFF}

/* ---------- mission control ---------- */
.mc{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:16px;align-items:start}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.ring{width:190px;height:190px}
.ring .track{fill:none;stroke:rgba(145,175,220,.13);stroke-width:12}
.ring .prog{fill:none;stroke:var(--info);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 7px rgba(56,225,255,.55));transition:stroke-dasharray .8s cubic-bezier(.16,1,.3,1)}
.ring-val{font-family:var(--disp);font-size:42px;font-weight:700;fill:var(--tx);font-variant-numeric:tabular-nums}
.ring-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;fill:var(--tx3)}
.delta{font-family:var(--mono);font-size:12px;color:var(--ok)}
.segs{display:flex;flex-direction:column;gap:9px;width:100%;margin-top:14px}
.seg{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:12.5px}
.seg .bar{grid-column:1/-1;height:4px;border-radius:999px;background:rgba(145,175,220,.13);overflow:hidden}
.seg .bar i{display:block;height:100%;border-radius:999px;background:var(--info)}
.seg .n{font-family:var(--mono);color:var(--tx3);font-variant-numeric:tabular-nums}

.nba{border:1px solid rgba(56,225,255,.30);background:linear-gradient(135deg,rgba(56,225,255,.09),rgba(155,107,255,.06));border-radius:var(--r-lg);padding:20px}
.nba h3{font-size:19px;margin:8px 0 6px}
.nba p{margin:0 0 16px;color:var(--tx2);max-width:60ch}
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border-radius:var(--r-sm);
  background:var(--info);color:var(--tx-inv);font-weight:600;font-size:14px;
  transition:transform .12s,box-shadow .12s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(56,225,255,.26)}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--bd-strong)}
.btn.ghost:hover{background:rgba(145,175,220,.07);box-shadow:none}
.btn.sim{background:var(--sim);color:#fff}
.btn.sim:hover{box-shadow:0 8px 24px rgba(155,107,255,.30)}

.alerts{display:flex;flex-direction:column}
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-top:1px solid var(--bd)}
.alert:first-child{border-top:none}
.alert .mark{margin-top:7px}
.alert p{margin:0;font-size:13.5px}
.alert .meta{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-top:3px}

.missions{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.mission{
  display:flex;flex-direction:column;gap:9px;padding:16px;border-radius:var(--r-md);
  border:1px solid var(--bd);background:var(--bg-overlay);text-align:left;width:100%;
  transition:border-color .14s,transform .14s;
}
.mission:hover{border-color:var(--bd-strong);transform:translateY(-2px)}
.mission h4{font-size:14.5px;font-weight:600}
.mission .why{font-size:12.5px;color:var(--tx3);margin:0;flex:1}
.mission .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:580px;font-size:13px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--tx3);font-weight:500;white-space:nowrap}
tbody tr:hover{background:rgba(145,175,220,.04)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- threat map ---------- */
.tmap{display:grid;grid-template-columns:1fr minmax(240px,300px);gap:16px}
.plot{width:100%;height:auto;display:block}
.plot text{font-family:var(--mono);font-size:9px;fill:var(--tx3)}
.plot .axis{stroke:rgba(145,175,220,.16);stroke-width:1}
.plot .gl{stroke:rgba(145,175,220,.07);stroke-width:1}
.node{cursor:pointer}
.node circle{transition:r .16s,opacity .16s}
.node:hover circle{opacity:1}
.node text{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tlegend{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:2px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tlegend button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 8px;border-radius:var(--r-sm);font-size:12.5px;color:var(--tx2);border:1px solid transparent}
.tlegend button:hover{background:rgba(145,175,220,.06);color:var(--tx)}
.tlegend button[aria-pressed="true"]{background:rgba(56,225,255,.09);border-color:rgba(56,225,255,.26);color:var(--tx)}
.tlegend .tn{width:17px;flex:none;text-align:center;font-size:11px;color:var(--tx3)}
.tlegend button[aria-pressed="true"] .tn{color:var(--info)}
.tlegend .tl{overflow-wrap:anywhere}

/* ---------- simulation ---------- */
.sim-stage{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sim-bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;
  border:1px solid rgba(155,107,255,.32);border-radius:var(--r-md);
  background:linear-gradient(90deg,rgba(155,107,255,.11),rgba(17,23,38,.6));
}
.clock{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.tplus{font-family:var(--mono);font-size:12px;color:var(--sim);letter-spacing:.08em}
.timer{font-family:var(--mono);font-size:13px;color:var(--warn);font-variant-numeric:tabular-nums}
.timer.off{color:var(--tx3)}

.rail-time{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.rail-time i{width:26px;height:3px;border-radius:2px;background:rgba(145,175,220,.18);display:block}
.rail-time i.done{background:var(--sim)}
.rail-time i.now{background:var(--tx);box-shadow:0 0 8px var(--tx)}

.inject{border:1px solid var(--bd);border-radius:var(--r-lg);background:var(--bg-raised);overflow:hidden}
.inject-h{display:flex;gap:10px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--bd);background:rgba(5,7,13,.45);flex-wrap:wrap}
.inject-b{padding:20px}
.inject-b .msg{font-size:16px;line-height:1.65;margin:0 0 4px}
.inject-b .q{font-family:var(--disp);font-size:17px;font-weight:600;margin:18px 0 4px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);
  border:1px solid var(--bd);background:var(--bg-overlay);text-align:left;width:100%;
  transition:border-color .13s,background .13s;
}
.opt:hover:not(:disabled){border-color:var(--sim);background:rgba(155,107,255,.08)}
.opt:disabled{opacity:.42;cursor:default}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--tx3);padding-top:1px}
.opt .t{font-size:14px}

.consq{border:1px solid var(--bd-strong);border-radius:var(--r-lg);background:var(--bg-overlay);padding:20px;display:flex;flex-direction:column;gap:14px}
.consq .lead{font-size:15.5px;margin:0;line-height:1.65}
.consq .alt{font-size:13.5px;color:var(--tx2);margin:0;padding-left:14px;border-left:2px solid var(--bd-strong)}
.deltas{display:flex;gap:8px;flex-wrap:wrap}
.dlt{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--bd);font-variant-numeric:tabular-nums}
.dlt.up{color:#A8F2E3;border-color:rgba(46,230,196,.40)}
.dlt.dn{color:#FFC2B1;border-color:rgba(255,107,74,.40)}
.dlt.z{color:var(--tx3)}

.axes{display:grid;gap:11px}
.ax{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:13px}
.ax .bar{grid-column:1/-1;height:6px;border-radius:999px;background:rgba(145,175,220,.13);overflow:hidden}
.ax .bar i{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.ax .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--tx2)}

/* ---------- maturity ---------- */
.mx{overflow-x:auto}
.mx table{min-width:620px}
.cell{display:flex;gap:3px}
.lv{width:22px;height:22px;border-radius:4px;background:rgba(145,175,220,.09);border:1px solid transparent;position:relative}
.lv.on{border-color:rgba(232,238,249,.22)}
.lv.cur{outline:2px solid var(--tx);outline-offset:1px}
.lv.tgt::after{content:"";position:absolute;inset:4px;border:1.5px dashed rgba(232,238,249,.7);border-radius:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx3);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- toolkit ---------- */
.kits{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.kit{display:flex;flex-direction:column;gap:8px;padding:15px;border-radius:var(--r-md);border:1px solid var(--bd);background:var(--bg-overlay);text-align:left;transition:border-color .13s}
.kit:hover{border-color:var(--bd-strong)}
.kit h4{font-size:13.5px;font-weight:600}
.kit p{margin:0;font-size:12px;color:var(--tx3);flex:1}
.kit .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}

.note{font-size:12.5px;color:var(--tx3);border-left:2px solid var(--bd-strong);padding-left:12px;margin:0}
.empty{padding:28px;text-align:center;color:var(--tx3);font-size:13.5px}

@media (max-width:920px){
  :root{--rail:100%}
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;overflow-x:auto;padding:12px 16px}
  .rail .brand{flex:none}
  .nav{flex-direction:row;gap:4px}
  .nav button{white-space:nowrap;padding:7px 11px;font-size:13px}
  .nav button span.lbl{display:inline}
  .rail-foot{display:none}
  .mc,.tmap{grid-template-columns:1fr}
  main{padding:20px 16px 56px}
  .topbar{padding:10px 16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}
</style>

<div class="app" id="app">
  <aside class="rail">
    <div class="brand">
      <svg class="brand-mk" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2 3 6v6c0 5 3.8 9 9 10 5.2-1 9-5 9-10V6z" fill="none" stroke="#38E1FF" stroke-width="1.4"/>
        <path d="M12 7v10M8 10.5h8" stroke="#9B6BFF" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div><b>REDUTĂ</b><span>Cyber Range</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Secțiuni"></nav>
    <div class="rail-foot">
      <p class="eyebrow" style="margin:0 0 6px">Sesiune demo</p>
      <p style="margin:0;font-size:12px;color:var(--tx3);line-height:1.5">Date de exemplu pentru o clinică de 90 de angajați. Progresul se păstrează doar în acest browser.</p>
    </div>
  </aside>

  <div>
    <header class="topbar">
      <span class="crumb">Sector <b>Sănătate</b> · Furnizori privați &lt;250 angajați</span>
      <span class="spacer"></span>
      <div class="roles" id="roles" role="group" aria-label="Traseu">
        <button data-role="mgmt" aria-pressed="true">Management</button>
        <button data-role="tech" aria-pressed="false">Tehnic</button>
        <button data-role="hyg" aria-pressed="false">Igienă</button>
      </div>
      <span class="chip"><span class="mark info"></span>Readiness <span class="val mono" id="topScore">—</span></span>
    </header>
    <main id="main"></main>
  </div>
</div>

<script>
"use strict";

/* ============ conținut sectorial: Sănătate ============ */

const ASSETS = [
  {id:"his", n:"HIS / EHR", imp:"Critică", threats:"Ransomware, exfiltrare", vuln:"Acces de la distanță al furnizorului fără MFA, conturi partajate pe secții", impact:"Oprirea activității clinice, breșă masivă de date de sănătate"},
  {id:"pacs", n:"PACS / imagistică", imp:"Critică", threats:"Ransomware, expunere pe internet", vuln:"Servere PACS expuse, DICOM fără autentificare, SO neactualizat pe modalități", impact:"Pierderea accesului la imagini, diagnostic întârziat"},
  {id:"dev", n:"Dispozitive medicale conectate", imp:"Critică", threats:"Compromitere, mișcare laterală", vuln:"Sisteme nesuportate, actualizare blocată de producător, parole implicite", impact:"Risc clinic direct pentru pacient"},
  {id:"idp", n:"Identități și conturi clinice", imp:"Critică", threats:"Credential theft, phishing", vuln:"Conturi partajate pe post, sesiuni deschise, MFA absent pe acces extern", impact:"Acces necontrolat la dosare, imposibilitatea atribuirii"},
  {id:"bkp", n:"Backup", imp:"Critică", threats:"Criptare, ștergere", vuln:"Backup pe același domeniu, fără copie offline, restaurare netestată", impact:"Imposibilitatea reluării activității"},
  {id:"lis", n:"Laborator (LIS)", imp:"Ridicată", threats:"Ransomware, alterarea datelor", vuln:"Integrare directă cu analizoare, conturi de serviciu privilegiate", impact:"Rezultate indisponibile sau nesigure"},
  {id:"tel", n:"Telemedicină / programare online", imp:"Ridicată", threats:"Compromitere web, DDoS", vuln:"Platformă administrată extern, fără limitare de rată", impact:"Expunere de date, oprirea programărilor"},
  {id:"bms", n:"Sisteme de facilitate (gaze, temperatură)", imp:"Ridicată", threats:"Compromitere OT/BMS", vuln:"Rețea comună cu IT-ul administrativ, acces de la distanță al instalatorului", impact:"Risc pentru pacienți, pierderea stocurilor termosensibile"}
];

const THREATS = [
  {id:"rw", n:"Ransomware cu dublă extorcare", actor:"Grupuri criminale organizate", vec:"Phishing, VPN/RDP expus, vulnerabilitate de perimetru",
   asset:"HIS, PACS, backup", mitre:["Initial Access","Credential Access","Lateral Movement","Exfiltration","Impact"],
   lk:5, im:5, ind:"Conturi de administrator noi, dezactivarea antivirusului, trafic ieșit masiv noaptea, ștergerea copiilor umbră"},
  {id:"exf", n:"Exfiltrarea dosarelor de pacient", actor:"Criminalitate cibernetică, insider", vec:"Credential theft, acces excesiv, dispozitiv pierdut",

/* readiness = maturitate + credit din simulare, exprimat pe 0-100 */
function readiness(){
  const base = MATURITY.reduce((a,b)=>a+b,0)/(DOMAINS.length*5)*100;
  const simAvg = (S.simAxes.clin+S.simAxes.data+S.simAxes.legal+S.simAxes.eviq)/4;
  const kitDone = Object.values(S.kits).filter(v=>v==="done").length/TOOLKIT.length*100;
  return Math.round(base*.55 + simAvg*.25 + kitDone*.20);
}

    <div class="head">
      <p class="eyebrow">Threat Landscape · Sănătate</p>
      <h1>Ce ne atacă, de fapt</h1>

    </div>
    <div class="tmap">
      <div class="panel">
        <h3>Probabilitate × impact</h3>

          ${[1,2,3,4,5].map(v=>`<line class="gl" x1="${X(v)}" y1="42" x2="${X(v)}" y2="300"/>`).join("")}

          ${[1,2,3,4,5].map(v=>`<text x="60" y="${Y(v)+3}" text-anchor="end">${v}</text>`).join("")}
          <text x="${(70+X(5))/2}" y="340" text-anchor="middle" style="letter-spacing:.10em">PROBABILITATE</text>
          <text x="22" y="171" text-anchor="middle" transform="rotate(-90 22 171)" style="letter-spacing:.10em">IMPACT</text>
          ${THREATS.map((th,i)=>{
            const on=th.id===S.threat, col= th.im>=5?"#FF6B4A": th.im>=4?"#FFB547": th.lk>=4?"#38E1FF":"#7C8AA3";

        </svg>
        <ol class="tlegend">
          ${THREATS.map((th,i)=>{
            const on=th.id===S.threat, tone= th.im>=5?"crit": th.im>=4?"warn": th.lk>=4?"info":"idle";
            return `<li><button data-threat="${th.id}" aria-pressed="${on}">
              <span class="tn mono">${i+1}</span><span class="mark ${tone}"></span><span class="tl">${esc(th.n)}</span>

          <div><dt class="eyebrow">Vector</dt><dd style="margin:2px 0 0">${esc(t.vec)}</dd></div>

  <div class="view sim-stage">
    <div class="sim-bar">
      <span class="tplus">${esc(st.tplus)}</span>
      <span class="clock">${esc(st.clock)}</span>

      <span class="timer ${S.timerOn?"":"off"}" id="tmr">${S.timerOn?"90s":"ceas oprit"}</span>

      <button class="btn ghost" style="padding:6px 12px;font-size:12.5px" data-sim="abort">Ieși din exercițiu</button>

        <span class="eyebrow">Sursa: ${esc(st.src)}</span>

        <div class="opts">
          ${st.opts.map((o,i)=>`<button class="opt" data-opt="${i}" ${showC?"disabled":""}>
            <span class="k">${String.fromCharCode(65+i)}</span><span class="t">${esc(o.t)}</span></button>`).join("")}
        </div>
      </div>
    </div>

    ${showC?`
    <div class="consq">
      <p class="eyebrow">Consecința</p>
      <p class="lead">${esc(last.c)}</p>
      ${last.alt?`<p class="alt"><strong>Alternativa:</strong> ${esc(last.alt)}</p>`:""}

    </div>`:`<p class="note">Decide înainte de a continua. Nu există opțiune neutră — și neintervenția este o decizie cu consecințe.</p>`}
  </div>`;
}

    <div class="panel flush">
      <div class="tw"><table>
        <thead><tr><th>Act / referință</th><th>Natura</th><th>Domeniu</th><th>Observație</th></tr></thead>
        <tbody>${COMPLIANCE.map(c=>`<tr>
          <td><strong>${esc(c.act)}</strong><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${c.mods.map(m=>`<span class="pill">${esc(m)}</span>`).join("")}</div></td>
          <td><span class="pill ${tone[c.kind]}"><span class="mark ${tone[c.kind]}"></span>${lab[c.kind]}</span></td>
          <td style="color:var(--tx2)">${esc(c.scope)}</td>
          <td style="color:var(--tx2);max-width:400px">${esc(c.note)}</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>
    <div class="panel" style="border-color:rgba(255,181,71,.28)">
      <span class="pill warn"><span class="mark warn"></span>De verificat înainte de livrare</span>
      <h3 style="margin:12px 0 8px;font-size:16px">Încadrarea se stabilește juridic, nu dintr-un tabel</h3>
      <p style="margin:0;color:var(--tx2);max-width:72ch">Un cabinet individual poate să nu intre în domeniul NIS2 din cauza pragurilor de dimensiune, dar rămâne integral sub GDPR și poate fi tras în sfera cerințelor prin contractele cu spitale sau case de asigurări. Cele două lucruri se tratează separat. Verifică textul în vigoare în EUR-Lex și la DNSC pentru fiecare organizație concretă.</p>
    </div>
  </div>`;
}

/* ============ interacțiune ============ */

let tmrId=null, tmrLeft=90;
function stopTimer(){ if(tmrId){clearInterval(tmrId);tmrId=null;} }
function startTimer(){
  stopTimer();
  const el=document.getElementById("tmr"); if(!el) return;
  const answered = S.simLog.some(l=>l.step===S.simStep);
  if(!S.timerOn||answered){ el.textContent = S.timerOn?"decis":"ceas oprit"; el.classList.toggle("off",!S.timerOn); return; }
  tmrLeft=90; el.classList.remove("off"); el.textContent=tmrLeft+"s";
  tmrId=setInterval(()=>{
    tmrLeft--;
    const e=document.getElementById("tmr"); if(!e){stopTimer();return;}
    e.textContent = tmrLeft>0 ? tmrLeft+"s" : "timpul a expirat";
    if(tmrLeft<=0){ stopTimer(); e.style.color="var(--crit)"; }
  },1000);
}

function choose(i){
  const st=SCENARIO.steps[S.simStep], o=st.opts[i];
  for(const k in o.d) S.simAxes[k]=Math.max(0,Math.min(100,S.simAxes[k]+o.d[k]*5));
  S.simLog.push({step:S.simStep,t:o.t,c:o.c,alt:o.alt,d:o.d});
  stopTimer(); save(); render();
}

document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-view]");
  if(nav){ S.view=nav.dataset.view; stopTimer(); save(); render(); return; }

  const go=e.target.closest("[data-go]");
  if(go){ S.view=go.dataset.go; save(); render(); return; }

  const role=e.target.closest("#roles [data-role]");
  if(role){
    S.role=role.dataset.role;
    document.querySelectorAll("#roles button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.role===S.role)));
    save(); render(); return;
  }

  const th=e.target.closest("[data-threat]");
  if(th){ S.threat=th.dataset.threat; save(); render(); return; }

  const opt=e.target.closest("[data-opt]");
  if(opt && !opt.disabled){ choose(+opt.dataset.opt); return; }

  const kit=e.target.closest("[data-kit]");
  if(kit){
    const k=kit.dataset.kit, order=["todo","prog","done"];
    S.kits[k]=order[(order.indexOf(S.kits[k]||"todo")+1)%3];
    save(); render(); return;
  }

  const sim=e.target.closest("[data-sim]");
  if(sim){
    const a=sim.dataset.sim;
    if(a==="start"){ S.simStep=0; S.simLog=[]; S.simDone=false; S.simAxes={clin:50,data:50,legal:50,eviq:50}; }
    if(a==="next"){ if(S.simStep+1<SCENARIO.steps.length) S.simStep++; else { S.simDone=true; S.simStep=-1; } }
    if(a==="toggletimer"){ S.timerOn=!S.timerOn; }
    if(a==="abort"){ S.simStep=-1; S.simLog=[]; S.simDone=false; stopTimer(); }
    if(a==="reset"){ S.simStep=0; S.simLog=[]; S.simDone=false; S.simAxes={clin:50,data:50,legal:50,eviq:50}; }
    save(); render(); return;
  }
});

document.addEventListener("keydown",e=>{
  const n=e.target.closest("[data-threat]");
  if(n&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); S.threat=n.dataset.threat; save(); render(); }
});

render();
</script>
